[package]
name = "rodio-engine-source"
version = "0.8.13"
edition = "2021"
license-file.workspace = true

[lib]
path = "src/lib.rs"

[features]
profiling = ["realtime-engine/profiling"]
routing-tree-executor = ["realtime-engine/routing-tree-executor"]

[dependencies]
crossbeam-channel = "0.5"
hound = "3.5"
realtime-engine = { path = "../realtime-engine" }
rodio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
realtime-engine = { path = "../realtime-engine", features = ["test-support"] }
