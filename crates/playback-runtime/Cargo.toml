[package]
name = "playback-runtime"
version = "0.8.0"
edition = "2021"
license-file.workspace = true

[lib]
path = "src/lib.rs"

[features]
test-support = []

[dependencies]
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1.1"
platform-core = { path = "../platform-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[[bin]]
name = "playback_timing_probe"
path = "src/bin/playback_timing_probe.rs"
