[package]
name = "octessera-hal"
version = "0.7.0"
edition = "2021"

[dependencies]
platform-core = { path = "../platform-core" }
# Pi Zero 2W specific dependencies (feature-gated)
rppal = { version = "0.22.1", optional = true }
libc = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
spidev = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The Orange smoke target matches the board's libgpiod uAPI v2 request.
gpiocdev = {
    version = "0.8",
    default-features = false,
    features = ["uapi_v2"],
    optional = true,
}
i2cdev = { version = "0.6", optional = true }

[features]
default = []
raspberry-pi-zero-2w = ["rpi-zero-2w"]
rpi-zero-2w = ["dep:rppal", "dep:spidev", "dep:i2cdev", "dep:libc"]
pi-zero = ["raspberry-pi-zero-2w"]
orange-pi-zero-2w = ["dep:gpiocdev", "dep:spidev", "dep:libc"]

[[bin]]
name = "orange-oled-smoke"
path = "src/bin/orange_oled_smoke.rs"
required-features = ["orange-pi-zero-2w"]
