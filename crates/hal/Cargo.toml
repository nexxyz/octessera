[package]
name = "octessera-hal"
version = "0.8.1"
edition = "2021"
license-file.workspace = true

[dependencies]
platform-core = { path = "../platform-core" }
# Pi Zero 2W specific dependencies (feature-gated)
rppal = { version = "0.22.1", optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
spidev = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The Orange smoke target matches the board's libgpiod uAPI v2 request.
gpiocdev = {
    version = "0.8",
    default-features = false,
    features = ["uapi_v2"],
    optional = true,
}
i2cdev = { version = "0.6", optional = true }

[features]
default = []
raspberry-pi-zero-2w = ["dep:rppal", "dep:spidev", "dep:i2cdev", "dep:libc"]
rpi-zero-2w = ["raspberry-pi-zero-2w"]
pi-zero = ["raspberry-pi-zero-2w"]
orange-pi-zero-2w = [
    "dep:gpiocdev",
    "dep:spidev",
    "dep:libc",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
]

[[bin]]
name = "orange-oled-smoke"
path = "src/bin/orange_oled_smoke.rs"
required-features = ["orange-pi-zero-2w"]

[[bin]]
name = "orange-seesaw-smoke"
path = "src/bin/orange_seesaw_smoke.rs"
required-features = ["orange-pi-zero-2w"]

[dev-dependencies]
serde_json = "1"
