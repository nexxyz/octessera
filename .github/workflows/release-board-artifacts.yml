name: Release board artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
permissions:
  contents: read

jobs:
  raspberry_runtime:
    name: Build Raspberry runtime once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu
      - name: Install pinned cross
        env:
          CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' "$CROSS_SHA256" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin
          cross --version
      - name: Build Raspberry runtime exactly once
        run: cross build --release --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-raspberry-pi-zero-2w
      - name: Create and verify Raspberry runtime bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p runtime-bundle
          install -m 0755 target/aarch64-unknown-linux-gnu/release/octessera-pi runtime-bundle/octessera-pi
          binary_sha256="$(sha256sum runtime-bundle/octessera-pi | awk '{print $1}')"
          python3 - "$RELEASE_VERSION" "$binary_sha256" > runtime-bundle/octessera-runtime.json <<'PY'
          import json
          import sys

          version, binary_sha256 = sys.argv[1:]
          json.dump({
              "artifact_kind": "production-runtime",
              "binary_sha256": binary_sha256,
              "name": "octessera-pi",
              "profile": "raspberry-pi-zero-2w",
              "runtime_ready": True,
              "version": version,
          }, sys.stdout, sort_keys=True, indent=2)
          print()
          PY
          printf '%s  octessera-pi\n' "$binary_sha256" > runtime-bundle/SHA256SUMS
          python3 - runtime-bundle "$RELEASE_VERSION" <<'PY'
          import json
          import pathlib
          import sys

          bundle = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          metadata = json.loads((bundle / "octessera-runtime.json").read_text())
          if set(metadata) != {"artifact_kind", "binary_sha256", "name", "profile", "runtime_ready", "version"}:
              raise SystemExit("runtime metadata keys are not exact")
          if metadata["version"] != version or metadata["profile"] != "raspberry-pi-zero-2w":
              raise SystemExit("Raspberry runtime metadata does not match the release")
          if metadata["binary_sha256"] != __import__("hashlib").sha256((bundle / "octessera-pi").read_bytes()).hexdigest():
              raise SystemExit("Raspberry runtime metadata is not hash-bound")
          if (bundle / "SHA256SUMS").read_text() != f"{metadata['binary_sha256']}  octessera-pi\n":
              raise SystemExit("Raspberry runtime checksum is not exact")
          if sorted(path.name for path in bundle.iterdir()) != ["SHA256SUMS", "octessera-pi", "octessera-runtime.json"]:
              raise SystemExit("Raspberry runtime bundle entries are not exact")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-raspberry-runtime
          path: ./runtime-bundle/*
          if-no-files-found: error
  orange_runtime:
    name: Build Orange runtime once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu
      - name: Install pinned cross
        env:
          CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' "$CROSS_SHA256" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin
          cross --version
      - name: Build Orange runtime exactly once
        run: cross build --release --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-orange-pi-zero-2w
      - name: Create and verify Orange runtime bundle
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p runtime-bundle
          install -m 0755 target/aarch64-unknown-linux-gnu/release/octessera-pi runtime-bundle/octessera-pi
          binary_sha256="$(sha256sum runtime-bundle/octessera-pi | awk '{print $1}')"
          python3 - "$RELEASE_VERSION" "$binary_sha256" > runtime-bundle/octessera-runtime.json <<'PY'
          import json
          import sys

          version, binary_sha256 = sys.argv[1:]
          json.dump({
              "artifact_kind": "production-runtime",
              "binary_sha256": binary_sha256,
              "name": "octessera-pi",
              "profile": "orange-pi-zero-2w",
              "runtime_ready": True,
              "version": version,
          }, sys.stdout, sort_keys=True, indent=2)
          print()
          PY
          printf '%s  octessera-pi\n' "$binary_sha256" > runtime-bundle/SHA256SUMS
          python3 - runtime-bundle "$RELEASE_VERSION" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          bundle = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          metadata = json.loads((bundle / "octessera-runtime.json").read_text())
          expected_keys = {"artifact_kind", "binary_sha256", "name", "profile", "runtime_ready", "version"}
          if set(metadata) != expected_keys:
              raise SystemExit("Orange runtime metadata keys are not exact")
          if metadata != {
              "artifact_kind": "production-runtime",
              "binary_sha256": metadata["binary_sha256"],
              "name": "octessera-pi",
              "profile": "orange-pi-zero-2w",
              "runtime_ready": True,
              "version": version,
          }:
              raise SystemExit("Orange runtime metadata values are not exact")
          if metadata["binary_sha256"] != hashlib.sha256((bundle / "octessera-pi").read_bytes()).hexdigest():
              raise SystemExit("Orange runtime metadata is not hash-bound")
          if (bundle / "SHA256SUMS").read_text() != f"{metadata['binary_sha256']}  octessera-pi\n":
              raise SystemExit("Orange runtime checksum is not exact")
          if sorted(path.name for path in bundle.iterdir()) != ["SHA256SUMS", "octessera-pi", "octessera-runtime.json"]:
              raise SystemExit("Orange runtime bundle entries are not exact")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-orange-runtime
          path: ./runtime-bundle/*
          if-no-files-found: error
  raspberry_kernel:
    name: Build Raspberry kernel package
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - name: Run synthetic kernel tests first
        run: |
          bash tools/pi-kernel/test-rpi-kernel.sh
          sudo bash tools/pi-image/test-rpi-kernel-image.sh
      - name: Install Raspberry kernel constructor dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc bison flex fakeroot debhelper \
            build-essential gcc g++ make dpkg-dev libssl-dev libelf-dev libncurses-dev \
            cpio kmod rsync device-tree-compiler git python3 xz-utils zstd
      - name: Run the full Raspberry kernel constructor
        run: |
          set -euo pipefail
          rm -rf raspberry-kernel
          mkdir -p raspberry-kernel
          bash tools/pi-kernel/build-rpi-kernel.sh \
            --manifest tools/kernel-patches/orange-midi-interface-manifest.json \
            --output-dir "$GITHUB_WORKSPACE/raspberry-kernel"
      - name: Verify exact Raspberry kernel handoff
        run: |
          set -euo pipefail
          mapfile -t packages < <(find raspberry-kernel -maxdepth 1 -type f -name '*.deb' -print | sort)
          [[ "${#packages[@]}" == 1 ]] || { echo "Expected exactly one Raspberry kernel package, found ${#packages[@]}." >&2; exit 1; }
          for artifact in SHA256SUMS inventory.json provenance.json; do
            test -f "raspberry-kernel/$artifact" || { echo "Missing Raspberry kernel artifact: $artifact" >&2; exit 1; }
          done
          python3 tools/pi-kernel/validate-rpi-kernel-package.py \
            "${packages[0]}" \
            --manifest tools/kernel-patches/orange-midi-interface-manifest.json \
            --checksum-file raspberry-kernel/SHA256SUMS \
            --provenance-in raspberry-kernel/provenance.json
          (cd raspberry-kernel && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-raspberry-kernel-release-assets
          path: ./raspberry-kernel/*
          if-no-files-found: error
  raspberry_image:
    name: Build Raspberry image
    runs-on: ubuntu-latest
    needs: [raspberry_runtime, raspberry_kernel]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: octessera-raspberry-runtime
          path: runtime-bundle
      - uses: actions/download-artifact@v4
        with:
          name: octessera-raspberry-kernel-release-assets
          path: kernel-bundle
      - name: Stage the matching runtime into stage4
        run: |
          set -euo pipefail
          stage_root=tools/pi-image/stage4-octessera/files/root
          install -D -m 0755 runtime-bundle/octessera-pi "$stage_root/usr/local/bin/octessera-pi"
          install -d -m 0755 "$stage_root/usr/local/lib/octessera/production-runtime"
          for entry in octessera-pi octessera-runtime.json SHA256SUMS; do
            install -m 0644 "runtime-bundle/$entry" "$stage_root/usr/local/lib/octessera/production-runtime/$entry"
          done
          for updater_file in updater_protocol.py updater_state.py updater_assets.py updater_guard.py updater_cli.py; do install -D -m 0644 "tools/device-update/$updater_file" "$stage_root/usr/local/lib/octessera/$updater_file"; done
          cmp runtime-bundle/octessera-pi "$stage_root/usr/local/bin/octessera-pi"
      - name: Generate Raspberry image assets
        run: python3 tools/assets/generate_pi_logo_pngs.py
      - name: Install pi-gen dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            quilt parted debootstrap dosfstools rsync btrfs-progs kpartx xz-utils coreutils \
            qemu-user-static libarchive-tools arch-test device-tree-compiler unzip
      - name: Clone and pin pi-gen
        env:
          PIGEN_COMMIT: d7a31c6aa09f4b867902c51da2b45807c0a1709e
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/RPi-Distro/pi-gen.git pi-gen
          git -C pi-gen fetch --depth=1 origin "$PIGEN_COMMIT"
          git -C pi-gen checkout --detach "$PIGEN_COMMIT"
          [[ "$(git -C pi-gen rev-parse HEAD)" == "$PIGEN_COMMIT" ]]
          cp -a tools/pi-image/stage3-octessera-kernel pi-gen/
      - name: Stage Raspberry legal notices and copy disposable stage4
        run: |
          set -euo pipefail
          export OCTESSERA_REPOSITORY_ROOT="$GITHUB_WORKSPACE"
          echo "OCTESSERA_REPOSITORY_ROOT=$OCTESSERA_REPOSITORY_ROOT" >> "$GITHUB_ENV"
          stage_root=tools/pi-image/stage4-octessera/files/root
          cleanup() { sudo rm -rf "$stage_root/usr/share/doc/octessera"; }
          trap cleanup EXIT
          sudo rm -rf "$stage_root/usr/share/doc/octessera"
          sudo python3 tools/legal/stage_notices.py \
            --repository-root "$OCTESSERA_REPOSITORY_ROOT" \
            --destination-root "$GITHUB_WORKSPACE/tools/pi-image/stage4-octessera/files/root"
          sudo python3 tools/legal/stage_notices.py \
            --repository-root "$OCTESSERA_REPOSITORY_ROOT" \
            --destination-root "$GITHUB_WORKSPACE/tools/pi-image/stage4-octessera/files/root" \
            --check
          sudo cp -a tools/pi-image/stage4-octessera pi-gen/
      - name: Configure and run pi-gen
        run: |
          set -euo pipefail
          mapfile -t packages < <(find "$GITHUB_WORKSPACE/kernel-bundle" -maxdepth 1 -type f -name '*.deb' -printf '%f\n' | sort)
          [[ "${#packages[@]}" == 1 ]] || { echo "Expected exactly one downloaded Raspberry kernel package, found ${#packages[@]}." >&2; exit 1; }
          export OCTESSERA_RELEASE_VERSION="${{ inputs.version }}" OCTESSERA_RELEASE_TAG="${{ inputs.tag }}" OCTESSERA_BOARD_PROFILE_ID="raspberry-pi-zero-2w"
          export OCTESSERA_KERNEL_PACKAGE="$GITHUB_WORKSPACE/kernel-bundle/${packages[0]}"
          export OCTESSERA_KERNEL_CHECKSUMS="$GITHUB_WORKSPACE/kernel-bundle/SHA256SUMS"
          export OCTESSERA_KERNEL_PROVENANCE="$GITHUB_WORKSPACE/kernel-bundle/provenance.json"
          cat > pi-gen/config <<EOF
          IMG_NAME=octessera-raspberry-pi-zero-2w
          RELEASE=bookworm
          TARGET_ARCH=arm64
          STAGE_LIST="stage0 stage1 stage2 stage3-octessera-kernel stage4-octessera"
          OCTESSERA_RELEASE_VERSION=$OCTESSERA_RELEASE_VERSION
          OCTESSERA_RELEASE_TAG=$OCTESSERA_RELEASE_TAG
          OCTESSERA_BOARD_PROFILE_ID=$OCTESSERA_BOARD_PROFILE_ID
          OCTESSERA_KERNEL_PACKAGE=$OCTESSERA_KERNEL_PACKAGE
          OCTESSERA_KERNEL_CHECKSUMS=$OCTESSERA_KERNEL_CHECKSUMS
          OCTESSERA_KERNEL_PROVENANCE=$OCTESSERA_KERNEL_PROVENANCE
          OCTESSERA_REPOSITORY_ROOT=$OCTESSERA_REPOSITORY_ROOT
          EXPORT_DIR=deploy
          DEPLOY_ZIP=1
          ENABLE_SSH=0
          EOF
          cd pi-gen
          sudo --preserve-env=OCTESSERA_RELEASE_VERSION,OCTESSERA_RELEASE_TAG,OCTESSERA_BOARD_PROFILE_ID,OCTESSERA_KERNEL_PACKAGE,OCTESSERA_KERNEL_CHECKSUMS,OCTESSERA_KERNEL_PROVENANCE,OCTESSERA_REPOSITORY_ROOT ./build.sh
      - name: Select and verify the single Raspberry ZIP
        run: |
          set -euo pipefail
          mkdir -p release-assets extracted-image
          mapfile -t zip_files < <(find pi-gen/deploy -maxdepth 1 -type f -name '*.zip' -print | sort)
          [[ "${#zip_files[@]}" == 1 ]] || { echo "Expected exactly one pi-gen ZIP, found ${#zip_files[@]}." >&2; exit 1; }
          asset="release-assets/octessera-${{ inputs.version }}-raspberry-pi-zero-2w.img.zip"
          cp "${zip_files[0]}" "$asset"
          python3 tools/pi-image/package-rpi-imager-zip.py \
            --zip "$asset" \
            --version "${{ inputs.version }}" \
            --tag "${{ inputs.tag }}" \
            --repository "$GITHUB_REPOSITORY" \
            --board-profile raspberry-pi-zero-2w \
            --manifest-out "release-assets/octessera-${{ inputs.version }}-raspberry-pi-zero-2w.rpi-imager-manifest"
          sudo bash tools/pi-image/verify-sanitized-image.sh "$asset"
          unzip -q "$asset" -d extracted-image
          mapfile -t images < <(find extracted-image -type f -name '*.img' -print | sort)
          [[ "${#images[@]}" == 1 ]] || { echo "Expected exactly one image extracted from the Raspberry ZIP, found ${#images[@]}." >&2; exit 1; }
          mapfile -t packages < <(find kernel-bundle -maxdepth 1 -type f -name '*.deb' -print | sort)
          sudo bash tools/pi-image/verify-rpi-kernel-image.sh \
            --image "${images[0]}" \
            --package "${packages[0]}" \
            --checksum kernel-bundle/SHA256SUMS \
            --provenance kernel-bundle/provenance.json \
            --manifest tools/kernel-patches/orange-midi-interface-manifest.json
          (cd release-assets && sha256sum ./*.zip ./*.rpi-imager-manifest > SHA256SUMS-pi.txt && sha256sum -c SHA256SUMS-pi.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-raspberry-image-release-assets
          path: ./release-assets/*
          if-no-files-found: error
  orange_image:
    name: Build Orange production image
    runs-on: ubuntu-latest
    needs: orange_runtime
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: custom
      - run: test "$(git -C custom rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: octessera-orange-runtime
          path: orange-runtime
      - name: Build Orange production image from local runtime
        uses: ./custom/.github/actions/build-armbian-image
        with:
          board: orangepizero2w
          release: trixie
          kernel_branch: current
          ui: minimal
          compression: sha,img,xz
          extensions: octessera_midi octessera_image_sanitize
          armbian_build_ref: fa7a7b2294d9e760a77630950afd460b7a0b2a26
          share_log: yes
          image_kind: production
          runtime_bundle_path: ${{ github.workspace }}/orange-runtime
          source_sha: ${{ inputs.source_sha }}
          boot_proof_mode: phase5-constructor
          construction_contract: resources/image-construction/boot-layers/orange-pi-zero-2w.json
      - name: Normalize and verify Orange release handoff
        env:
          ARMBIAN_BUILD_REF: fa7a7b2294d9e760a77630950afd460b7a0b2a26
          GITHUB_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          custom_root="$GITHUB_WORKSPACE/custom"
          mkdir -p release-assets
          mapfile -t images < <(find build/output/images -maxdepth 1 -type f -name '*.img.xz' -print | sort)
          [[ "${#images[@]}" == 1 ]] || { echo "Expected exactly one Orange .img.xz artifact, found ${#images[@]}." >&2; exit 1; }
          image="release-assets/octessera-${{ inputs.version }}-orange-pi-zero-2w.img.xz"
          cp "${images[0]}" "$image"
          printf '%s  %s\n' "$(sha256sum "$image" | awk '{print $1}')" "$(basename "$image")" > "$image.sha256"
          mapfile -t native_packages < <(bash "$custom_root/tools/armbian-image/find-orange-kernel-packages.sh" build/output/debs)
          [[ "${#native_packages[@]}" == 2 ]] || { echo "Expected exactly two native Orange kernel packages, found ${#native_packages[@]}." >&2; exit 1; }
          mapfile -t canonical_packages < <(python3 - "$custom_root/tools/kernel-patches/orange-midi-interface-manifest.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              for package in json.load(handle)["build_frameworks"]["armbian"]["packages"]:
                  print(package)
          PY
          )
          [[ "${#canonical_packages[@]}" == 2 ]] || { echo 'Orange canonical package list is not exact.' >&2; exit 1; }; canonical_release_paths=("release-assets/${canonical_packages[0]}" "release-assets/${canonical_packages[1]}")
          for package in "${canonical_packages[@]}"; do
            test -f "build/output/images/$package" || { echo "Missing canonical Orange package: $package" >&2; exit 1; }
            install -m 0644 "build/output/images/$package" "release-assets/$package"
          done
          evidence=build/output/images/octessera-orange-kernel-evidence.env
          test -f "$evidence"
          cp "$evidence" release-assets/octessera-orange-kernel-evidence.env
          kernel_provenance=build/output/images/octessera-qualification-metadata.txt
          image_provenance=build/output/images/octessera-orange-image-proof.json
          test -f "$kernel_provenance" && test -f "$image_provenance"
          cp "$kernel_provenance" release-assets/octessera-orange-kernel-provenance.txt
          cp "$image_provenance" release-assets/octessera-orange-image-proof.json
          sudo bash "$custom_root/tools/armbian-image/verify-orange-image.sh" \
            --image "$image" \
            --linux-image "${canonical_release_paths[0]}" \
            --linux-dtb "${canonical_release_paths[1]}" \
            --evidence release-assets/octessera-orange-kernel-evidence.env \
            --provenance release-assets/octessera-orange-kernel-provenance.txt \
            --manifest tools/kernel-patches/orange-midi-interface-manifest.json \
            --boot-proof-mode phase5-constructor \
            --construction-contract resources/image-construction/boot-layers/orange-pi-zero-2w.json \
            --image-provenance release-assets/octessera-orange-image-proof.json \
            --mode production
          for required in "$image" "$image.sha256" "${canonical_release_paths[0]}" "${canonical_release_paths[1]}" release-assets/octessera-orange-kernel-evidence.env release-assets/octessera-orange-kernel-provenance.txt release-assets/octessera-orange-image-proof.json; do
            test -f "$required" || { echo "Missing Orange release asset: $required" >&2; exit 1; }
          done
          (cd release-assets && sha256sum -c "$(basename "$image.sha256")" && sha256sum "$(basename "$image.sha256")" "${canonical_packages[0]}" "${canonical_packages[1]}" octessera-orange-kernel-evidence.env octessera-orange-kernel-provenance.txt octessera-orange-image-proof.json > SHA256SUMS-orange-pi-zero-2w.txt && sha256sum -c SHA256SUMS-orange-pi-zero-2w.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-orange-image-release-assets
          path: ./release-assets/*
          if-no-files-found: error

  raspberry_device:
    name: Package Raspberry device ZIP from runtime bundle
    runs-on: ubuntu-latest
    needs: raspberry_runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: octessera-raspberry-runtime
          path: runtime-bundle
      - name: Package matching Raspberry runtime bundle
        run: |
          set -euo pipefail
          python3 tools/device-update/package_device_bundle.py \
            --runtime-bundle runtime-bundle \
            --output-dir release-assets \
            --repository-root "$GITHUB_WORKSPACE" \
            --board-profile raspberry-pi-zero-2w \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-raspberry-device-release-assets
          path: ./release-assets/*
          if-no-files-found: error

  orange_device:
    name: Package Orange device ZIP from runtime bundle
    runs-on: ubuntu-latest
    needs: orange_runtime
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
      - run: test "$(git rev-parse HEAD)" = "${{ inputs.source_sha }}"
      - uses: actions/download-artifact@v4
        with:
          name: octessera-orange-runtime
          path: runtime-bundle
      - name: Package matching Orange runtime bundle
        run: |
          set -euo pipefail
          python3 tools/device-update/package_device_bundle.py \
            --runtime-bundle runtime-bundle \
            --output-dir release-assets \
            --repository-root "$GITHUB_WORKSPACE" \
            --board-profile orange-pi-zero-2w \
            --tag "${{ inputs.tag }}" \
            --version "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-orange-device-release-assets
          path: ./release-assets/*
          if-no-files-found: error
