name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v0.5.0
        required: true
        type: string
concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workflow_static:
    name: Validate workflow definition from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - run: |
          sudo apt-get update && sudo apt-get install -y shellcheck && test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" && bash tools/armbian-image/test-release-workflow.sh && bash -n tools/armbian-image/test-release-workflow.sh && shellcheck tools/armbian-image/test-release-workflow.sh

  resolve_draft:
    name: Resolve draft release through the API
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      asset_prefix: ${{ steps.release.outputs.asset_prefix }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Verify exact semver draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must look like v0.5.0; got $RELEASE_TAG" >&2; exit 1; }
          release_json="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$RELEASE_TAG" '
            [ .[][] | select(.tag_name == $tag) ] as $matches
            | if ($matches | length) != 1 then
                error("Expected exactly one release for tag \($tag)")
              elif $matches[0].draft != true then
                error("The release must remain a draft until the final publish job.")
              elif ($matches[0].assets | length) != 0 then
                error("The release draft must not already contain assets.")
              else
                $matches[0]
              end
          ')"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "asset_prefix=octessera-${RELEASE_TAG#v}"
            echo "release_id=$(jq -r '.id' <<< "$release_json")"
          } >> "$GITHUB_OUTPUT"

  release_info:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    needs: resolve_draft
    outputs:
      tag: ${{ needs.resolve_draft.outputs.tag }}
      version: ${{ needs.resolve_draft.outputs.version }}
      asset_prefix: ${{ needs.resolve_draft.outputs.asset_prefix }}
      release_id: ${{ needs.resolve_draft.outputs.release_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_draft.outputs.tag }}
          fetch-depth: 0
      - name: Verify tag commit and package version
        id: source
        env:
          RELEASE_TAG: ${{ needs.resolve_draft.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve_draft.outputs.version }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release version must be an exact semver.' >&2; exit 1; }
          [[ "$source_sha" == "$(git rev-parse "$RELEASE_TAG^{commit}")" ]] || { echo 'Checked out source does not match the release tag commit.' >&2; exit 1; }
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" >/dev/null
          python3 - <<'PY'
          import os
          import tomllib

          with open("apps/pi-zero/Cargo.toml", "rb") as handle:
              version = tomllib.load(handle)["package"]["version"]
          if version != os.environ["RELEASE_VERSION"]:
              raise SystemExit(f"Cargo package version {version} does not match release {os.environ['RELEASE_VERSION']}")
          PY
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  updater_protocol:
    name: Release updater and workflow static gates
    runs-on: ubuntu-latest
    needs: release_info
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify immutable source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.release_info.outputs.source_sha }}"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run targeted tests and static workflow gates
        run: |
          set -euo pipefail
          python3 -m py_compile tools/device-update/updater_protocol.py tools/device-update/updater_state.py tools/device-update/updater_assets.py tools/device-update/updater_guard.py tools/device-update/updater_cli.py tools/device-update/test_updater_protocol.py tools/device-update/test_updater_layout.py
          python3 -m unittest discover -s tools/device-update -p 'test_*.py'
          bash tools/device-update/smoke-test.sh
          bash tools/armbian-image/test-build-armbian-action.sh
          bash -n tools/device-update/*.sh tools/pi-image/verify-sanitized-image.sh tools/pi-image/verify-rpi-kernel-image.sh tools/pi-kernel/*.sh tools/armbian-image/*.sh
          shellcheck tools/device-update/*.sh tools/pi-kernel/*.sh
          find tools/armbian-image -maxdepth 1 -type f -name '*.sh' ! -name 'test-release-workflow.sh' -exec shellcheck {} +
          cmp tools/device-update/octessera-update tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update
          cmp tools/device-update/octessera-update userpatches/overlay/usr/local/sbin/octessera-update
          cmp tools/device-update/octessera-update-guard tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-guard
          cmp tools/device-update/octessera-update-guard userpatches/overlay/usr/local/sbin/octessera-update-guard
          cmp tools/device-update/octessera-update-recovery tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-recovery
          cmp tools/device-update/octessera-update-recovery userpatches/overlay/usr/local/sbin/octessera-update-recovery
          grep -q 'update-transaction.json' tools/pi/deploy-pi-fast.ps1
      - name: Validate sudoers and systemd units
        run: |
          sudo visudo -cf tools/pi-image/stage4-octessera/files/root/etc/sudoers.d/octessera-update
          sudo visudo -cf userpatches/overlay/etc/sudoers.d/octessera-update
          root="$(mktemp -d)"
          mkdir -p "$root/etc/systemd/system"
          printf '%s\n' '[Unit]' 'Description=Release validation sysinit target' > "$root/etc/systemd/system/sysinit.target"
          printf '%s\n' '[Unit]' 'Description=Release validation local filesystem target' > "$root/etc/systemd/system/local-fs.target"
          install -D -m 0755 tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-guard "$root/usr/local/sbin/octessera-update-guard"
          install -D -m 0755 tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-recovery "$root/usr/local/sbin/octessera-update-recovery"
          install -D -m 0644 tools/pi-image/stage4-octessera/files/root/etc/systemd/system/octessera-update-guard.service "$root/etc/systemd/system/octessera-update-guard.service"
          install -D -m 0644 tools/pi-image/stage4-octessera/files/root/etc/systemd/system/octessera-update-recovery.service "$root/etc/systemd/system/octessera-update-recovery.service"
          if grep -q '^ConditionPathExists=' tools/pi-image/stage4-octessera/files/root/etc/systemd/system/octessera-update-recovery.service; then
            echo 'Recovery units must not use ConditionPathExists.' >&2
            exit 1
          fi
          if grep -q '^ConditionPathExists=' userpatches/overlay/etc/systemd/system/octessera-update-recovery.service; then
            echo 'Recovery units must not use ConditionPathExists.' >&2
            exit 1
          fi
          systemd-analyze --root="$root" verify octessera-update-guard.service octessera-update-recovery.service
          rm -rf "$root"

  windows:
    name: Windows installer and portable EXE
    runs-on: windows-latest
    needs: release_info
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
      - name: Verify immutable source checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ needs.release_info.outputs.source_sha }}") { throw 'Immutable source checkout does not match source_sha.' }
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tauri:build
      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $assetDir = New-Item -ItemType Directory -Force -Path "release-assets"
          $installers = @(Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          $portable = "target/release/octessera-desktop.exe"
          if (-not (Test-Path -LiteralPath $portable)) { throw "Portable executable source not found" }
          $installerAsset = Join-Path $assetDir "${{ needs.release_info.outputs.asset_prefix }}-windows-installer.exe"
          $portableAsset = Join-Path $assetDir "${{ needs.release_info.outputs.asset_prefix }}-windows-portable.zip"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $installerAsset
          python tools/legal/package_portable_zip.py --repository-root . --executable $portable --output $portableAsset
          python tools/legal/verify_notice_archive.py --repository-root . --archive $portableAsset --payload-name octessera.exe
          $files = @(Get-ChildItem -LiteralPath $assetDir -File)
          if ($files.Count -ne 2) { throw "Expected exactly two Windows payload files" }
          $lines = $files | ForEach-Object { $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower(); "$hash  $($_.Name)" }
          $lines | Set-Content -LiteralPath (Join-Path $assetDir "SHA256SUMS-windows.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-windows-release-assets
          path: ./release-assets/*
          if-no-files-found: error

  ubuntu:
    name: Ubuntu DEB and AppImage
    runs-on: ubuntu-22.04
    needs: release_info
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
      - name: Verify immutable source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.release_info.outputs.source_sha }}"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libasound2-dev libfuse2 librsvg2-dev libsoup-3.0-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: APPIMAGE_EXTRACT_AND_RUN=1 corepack pnpm --dir apps/desktop exec tauri build --bundles deb,appimage
      - name: Prepare Ubuntu assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t deb_files < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print | sort)
          mapfile -t appimage_files < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          [[ "${#deb_files[@]}" == 1 ]] || { echo "Expected exactly one Ubuntu DEB, found ${#deb_files[@]}." >&2; exit 1; }
          [[ "${#appimage_files[@]}" == 1 ]] || { echo "Expected exactly one Ubuntu AppImage, found ${#appimage_files[@]}." >&2; exit 1; }
          deb_asset="$GITHUB_WORKSPACE/release-assets/${{ needs.release_info.outputs.asset_prefix }}-ubuntu-amd64.deb"
          appimage_asset="$GITHUB_WORKSPACE/release-assets/${{ needs.release_info.outputs.asset_prefix }}-ubuntu-x86_64.AppImage"
          cp "${deb_files[0]}" "$deb_asset"
          cp "${appimage_files[0]}" "$appimage_asset"
          (cd release-assets && sha256sum ./*.deb ./*.AppImage > SHA256SUMS-ubuntu.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-ubuntu-release-assets
          path: ./release-assets/*
          if-no-files-found: error

  board_artifacts:
    name: Board runtime, kernel, image, and device gates
    needs: release_info
    uses: ./.github/workflows/release-board-artifacts.yml
    with:
      tag: ${{ needs.release_info.outputs.tag }}
      version: ${{ needs.release_info.outputs.version }}
      source_sha: ${{ needs.release_info.outputs.source_sha }}
    secrets: inherit

  publish_release_assets:
    name: Verify, upload, and publish draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [release_info, updater_protocol, windows, ubuntu, board_artifacts, workflow_static]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify source and install final image proof dependencies
        run: test "$(git rev-parse HEAD)" = "${{ needs.release_info.outputs.source_sha }}" && sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio zstd
      - name: Download release artifacts into board-separated directories
        uses: actions/download-artifact@v4
        with:
          pattern: octessera-*-release-assets
          path: gathered-release-assets
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: octessera-raspberry-runtime
          path: gathered-runtime/raspberry
      - uses: actions/download-artifact@v4
        with:
          name: octessera-orange-runtime
          path: gathered-runtime/orange
      - name: Verify exact asset sets, checksums, runtime identity, and image evidence
        env:
          RELEASE_VERSION: ${{ needs.release_info.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.release_info.outputs.source_sha }}
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/gathered-release-assets"
          release_assets="$GITHUB_WORKSPACE/release-assets"
          evidence_staging="$GITHUB_WORKSPACE/release-evidence"
          mkdir -p "$release_assets" \
            "$evidence_staging/windows" "$evidence_staging/ubuntu" \
            "$evidence_staging/raspberry/image" "$evidence_staging/raspberry/device" \
            "$evidence_staging/raspberry/kernel" "$evidence_staging/raspberry/runtime" \
            "$evidence_staging/orange/image" "$evidence_staging/orange/device" \
            "$evidence_staging/orange/kernel" "$evidence_staging/orange/runtime" \
            "$evidence_staging/legal"
          require_exact_files() {
            local directory="$1"
            shift
            local -a expected=("$@") actual=()
            mapfile -t actual < <(find "$directory" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            [[ "${#actual[@]}" == "${#expected_sorted[@]}" && "${actual[*]}" == "${expected_sorted[*]}" ]] || {
              echo "Unexpected files under $directory: ${actual[*]}" >&2
              exit 1
            }
          }
          copy_asset() {
            local source="$1" destination="$2"
            [[ -f "$source" ]] || { echo "Missing release asset: $source" >&2; exit 1; }
            [[ ! -e "$destination" ]] || { echo "Release asset collision: $destination" >&2; exit 1; }
            install -m 0644 "$source" "$destination"
          }
          copy_evidence() {
            local source="$1" destination="$2"
            [[ -f "$source" ]] || { echo "Missing release evidence: $source" >&2; exit 1; }
            install -m 0644 "$source" "$destination"
          }
          prefix="octessera-$RELEASE_VERSION"
          rpi_image_dir="$root/octessera-raspberry-image-release-assets"
          rpi_device_dir="$root/octessera-raspberry-device-release-assets"
          require_exact_files "$root/octessera-windows-release-assets" "$prefix-windows-installer.exe" "$prefix-windows-portable.zip" SHA256SUMS-windows.txt
          require_exact_files "$root/octessera-ubuntu-release-assets" "$prefix-ubuntu-amd64.deb" "$prefix-ubuntu-x86_64.AppImage" SHA256SUMS-ubuntu.txt
          RPI_KERNEL_ARTIFACT_VERSION="0.7.5"
          rpi_kernel_package="linux-image-6.12.93-octessera-rpi-v8-${RPI_KERNEL_ARTIFACT_VERSION}_6.12.93-octessera${RPI_KERNEL_ARTIFACT_VERSION}-1_arm64.deb"
          rpi_kernel_dir="$root/octessera-raspberry-kernel-release-assets"
          rpi_manifest="$prefix-raspberry-pi-zero-2w.rpi-imager-manifest"
          rpi_device_zip="$prefix-raspberry-pi-zero-2w-device-aarch64.zip"
          rpi_device_sums="SHA256SUMS-raspberry-pi-zero-2w-device.txt"
          require_exact_files "$rpi_kernel_dir" "$rpi_kernel_package" SHA256SUMS inventory.json provenance.json
          require_exact_files "$rpi_image_dir" "$prefix-raspberry-pi-zero-2w.img.zip" "$rpi_manifest" SHA256SUMS-pi.txt
          require_exact_files "$rpi_device_dir" "$rpi_device_zip" "$rpi_device_sums"
          orange_kernel_image="linux-image-current-sunxi64_26.8.0-trunk.417_arm64.deb"
          orange_kernel_dtb="linux-dtb-current-sunxi64_26.8.0-trunk.417_arm64.deb"
          orange_image_dir="$root/octessera-orange-image-release-assets"
          require_exact_files "$orange_image_dir" "$prefix-orange-pi-zero-2w.img.xz" "$prefix-orange-pi-zero-2w.img.xz.sha256" "$orange_kernel_image" "$orange_kernel_dtb" octessera-orange-kernel-evidence.env octessera-orange-kernel-provenance.txt octessera-orange-image-proof.json SHA256SUMS-orange-pi-zero-2w.txt
          orange_device_dir="$root/octessera-orange-device-release-assets"
          orange_device_zip="$prefix-orange-pi-zero-2w-standalone-manual-aarch64.zip"
          orange_device_sums="SHA256SUMS-orange-pi-zero-2w-device.txt"
          require_exact_files "$orange_device_dir" "$orange_device_zip" "$orange_device_sums"
          copy_asset "$root/octessera-windows-release-assets/$prefix-windows-installer.exe" "$release_assets/$prefix-windows-installer.exe"
          copy_asset "$root/octessera-windows-release-assets/$prefix-windows-portable.zip" "$release_assets/$prefix-windows-portable.zip"
          copy_asset "$root/octessera-ubuntu-release-assets/$prefix-ubuntu-amd64.deb" "$release_assets/$prefix-ubuntu-amd64.deb"
          copy_asset "$root/octessera-ubuntu-release-assets/$prefix-ubuntu-x86_64.AppImage" "$release_assets/$prefix-ubuntu-x86_64.AppImage"
          copy_asset "$rpi_image_dir/$prefix-raspberry-pi-zero-2w.img.zip" "$release_assets/$prefix-raspberry-pi-zero-2w.img.zip"
          copy_asset "$rpi_image_dir/$rpi_manifest" "$release_assets/$rpi_manifest"
          copy_asset "$rpi_device_dir/$rpi_device_zip" "$release_assets/$rpi_device_zip"
          copy_asset "$rpi_device_dir/$rpi_device_sums" "$release_assets/$rpi_device_sums"
          copy_asset "$orange_image_dir/$prefix-orange-pi-zero-2w.img.xz" "$release_assets/$prefix-orange-pi-zero-2w.img.xz"
          copy_asset "$orange_device_dir/$orange_device_zip" "$release_assets/$orange_device_zip"
          python3 tools/legal/verify_notice_archive.py --repository-root . --archive "$release_assets/$prefix-windows-portable.zip" --payload-name octessera.exe
          (cd "$root/octessera-windows-release-assets" && sha256sum -c SHA256SUMS-windows.txt)
          (cd "$root/octessera-ubuntu-release-assets" && sha256sum -c SHA256SUMS-ubuntu.txt)
          (cd "$rpi_image_dir" && sha256sum -c SHA256SUMS-pi.txt)
          (cd "$rpi_device_dir" && sha256sum -c "$rpi_device_sums")
          (cd "$rpi_kernel_dir" && sha256sum -c SHA256SUMS)
          (cd "$orange_image_dir" && sha256sum -c "$prefix-orange-pi-zero-2w.img.xz.sha256" && sha256sum -c SHA256SUMS-orange-pi-zero-2w.txt)
          (cd "$orange_device_dir" && sha256sum -c "$orange_device_sums")
          sudo bash tools/armbian-image/verify-orange-image.sh \
            --image "$orange_image_dir/$prefix-orange-pi-zero-2w.img.xz" \
            --linux-image "$orange_image_dir/$orange_kernel_image" \
            --linux-dtb "$orange_image_dir/$orange_kernel_dtb" \
            --evidence "$orange_image_dir/octessera-orange-kernel-evidence.env" \
            --provenance "$orange_image_dir/octessera-orange-kernel-provenance.txt" \
            --manifest tools/kernel-patches/orange-midi-interface-manifest.json \
            --boot-proof-mode phase5-constructor \
            --construction-contract resources/image-construction/boot-layers/orange-pi-zero-2w.json \
            --image-provenance "$orange_image_dir/octessera-orange-image-proof.json" \
            --mode production
          for runtime_dir in gathered-runtime/raspberry gathered-runtime/orange; do
            mapfile -t runtime_entries < <(find "$runtime_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
            [[ "${#runtime_entries[@]}" == 3 && "${runtime_entries[*]}" == 'SHA256SUMS octessera-pi octessera-runtime.json' ]] || { echo "Runtime bundle entries are not exact: $runtime_dir" >&2; exit 1; }
            (cd "$runtime_dir" && sha256sum -c SHA256SUMS)
          done
          python3 tools/pi-kernel/validate-rpi-kernel-package.py \
            "$rpi_kernel_dir/$rpi_kernel_package" \
            --manifest tools/kernel-patches/orange-midi-interface-manifest.json \
            --checksum-file "$rpi_kernel_dir/SHA256SUMS" \
            --provenance-in "$rpi_kernel_dir/provenance.json"
          python3 - "$rpi_kernel_dir" "$rpi_kernel_package" <<'PY'
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          package = sys.argv[2]
          inventory = json.loads((root / "inventory.json").read_text())
          provenance = json.loads((root / "provenance.json").read_text())
          if {key: value for key, value in provenance.items() if key != "build"} != inventory:
              raise SystemExit("Raspberry inventory and provenance chain differ")
          if inventory["package"]["path"] != package:
              raise SystemExit("Raspberry kernel inventory package path changed")
          PY
          python3 - "$orange_image_dir" "$orange_kernel_image" "$orange_kernel_dtb" "$RELEASE_SOURCE_SHA" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          image_package, dtb_package, source_sha = sys.argv[2:]
          evidence = (root / "octessera-orange-kernel-evidence.env").read_text().splitlines()
          values = dict(line.split("=", 1) for line in evidence)
          provenance = (root / "octessera-orange-kernel-provenance.txt").read_text().splitlines()
          facts = dict(line.split("=", 1) for line in provenance if "=" in line)
          native_pairs = (
              (values["image_package_native_basename"], image_package),
              (values["dtb_package_native_basename"], dtb_package),
          )
          for native_name, canonical_name in native_pairs:
              native_prefix = canonical_name.removesuffix(".deb") + "__"
              if not native_name.startswith(native_prefix) or not native_name.endswith(".deb"):
                  raise SystemExit("Orange native package name is not derived from its canonical handoff name")
          for key, filename in (("image_package_sha256", image_package), ("dtb_package_sha256", dtb_package)):
              if values[key] != hashlib.sha256((root / filename).read_bytes()).hexdigest():
                  raise SystemExit(f"Orange provenance hash mismatch: {filename}")
          if facts.get("image_package") != image_package or facts.get("dtb_package") != dtb_package:
              raise SystemExit("Orange provenance canonical package chain is incomplete")
          evidence_hash = hashlib.sha256((root / "octessera-orange-kernel-evidence.env").read_bytes()).hexdigest()
          if facts.get("evidence_sha256") != evidence_hash or facts.get("armbian_build_ref") != "fa7a7b2294d9e760a77630950afd460b7a0b2a26" or facts.get("github_source_sha") != source_sha or facts.get("kernel_source_repository") != "https://github.com/torvalds/linux.git":
              raise SystemExit("Orange provenance evidence or build pin is not bound")
          PY
          python3 - "$RELEASE_VERSION" gathered-runtime/raspberry gathered-runtime/orange "$rpi_device_dir/$rpi_device_zip" "$orange_device_dir/$orange_device_zip" <<'PY'
          import json
          import pathlib
          import sys
          import stat
          import zipfile

          version, raspberry_dir, orange_dir, raspberry_zip, orange_zip = sys.argv[1:]
          for profile, bundle_dir, zip_path in (("raspberry-pi-zero-2w", raspberry_dir, raspberry_zip), ("orange-pi-zero-2w", orange_dir, orange_zip)):
              bundle = pathlib.Path(bundle_dir)
              metadata = json.loads((bundle / "octessera-runtime.json").read_text())
              if set(metadata) != {"artifact_kind", "binary_sha256", "name", "profile", "runtime_ready", "version"} or metadata["artifact_kind"] != "production-runtime" or metadata["name"] != "octessera-pi" or metadata["runtime_ready"] is not True or metadata["profile"] != profile or metadata["version"] != version:
                  raise SystemExit(f"{profile} runtime metadata is not exact")
              expected_names = ["octessera-pi", "octessera-device-release.json", "LICENSE", "NOTICE"] if profile == "raspberry-pi-zero-2w" else ["octessera-pi", "octessera-runtime.json", "SHA256SUMS", "octessera-device-release.json", "LICENSE", "NOTICE"]
              with zipfile.ZipFile(zip_path) as archive:
                  if archive.namelist() != expected_names:
                      raise SystemExit(f"{profile} device ZIP inventory is not exact")
                  for info in archive.infolist():
                      file_type = (info.external_attr >> 16) & 0o170000
                      mode = (info.external_attr >> 16) & 0o777
                      expected_mode = 0o755 if info.filename == "octessera-pi" else 0o644
                      if file_type != stat.S_IFREG or mode != expected_mode:
                          raise SystemExit(f"{profile} device ZIP executable mode is not exact")
                  if archive.read("LICENSE") != pathlib.Path("LICENSE").read_bytes() or archive.read("NOTICE") != pathlib.Path("NOTICE").read_bytes():
                      raise SystemExit(f"{profile} device ZIP legal files do not match the release source")
                  if archive.read("octessera-pi") != (bundle / "octessera-pi").read_bytes():
                      raise SystemExit(f"{profile} device ZIP does not reuse the runtime bytes")
                  manifest = json.loads(archive.read("octessera-device-release.json"))
                  if profile == "raspberry-pi-zero-2w":
                      if manifest.get("updater_protocol") != 2 or manifest.get("board_profile") != profile or manifest.get("version") != version:
                          raise SystemExit("Raspberry device metadata is not updater-compatible")
                  else:
                      if archive.read("octessera-runtime.json") != (bundle / "octessera-runtime.json").read_bytes() or archive.read("SHA256SUMS") != (bundle / "SHA256SUMS").read_bytes():
                          raise SystemExit("Orange standalone ZIP does not reuse the runtime metadata/checksum")
                      if manifest.get("updater_supported") is not False or "updater_protocol" in manifest or manifest.get("candidate_health_protocol") != 1 or manifest.get("distribution") != "standalone-manual":
                          raise SystemExit("Orange standalone device metadata claims unsupported updater behavior")
          PY
          copy_evidence "$root/octessera-windows-release-assets/SHA256SUMS-windows.txt" "$evidence_staging/windows/SHA256SUMS-windows.txt"
          copy_evidence "$root/octessera-ubuntu-release-assets/SHA256SUMS-ubuntu.txt" "$evidence_staging/ubuntu/SHA256SUMS-ubuntu.txt"
          copy_evidence "$rpi_image_dir/SHA256SUMS-pi.txt" "$evidence_staging/raspberry/image/SHA256SUMS-pi.txt"
          copy_evidence "$rpi_image_dir/$rpi_manifest" "$evidence_staging/raspberry/image/$rpi_manifest"
          copy_evidence "$rpi_device_dir/$rpi_device_sums" "$evidence_staging/raspberry/device/$rpi_device_sums"
          copy_evidence "$rpi_kernel_dir/$rpi_kernel_package" "$evidence_staging/raspberry/kernel/$rpi_kernel_package"
          copy_evidence "$rpi_kernel_dir/SHA256SUMS" "$evidence_staging/raspberry/kernel/SHA256SUMS"
          copy_evidence "$rpi_kernel_dir/inventory.json" "$evidence_staging/raspberry/kernel/inventory.json"
          copy_evidence "$rpi_kernel_dir/provenance.json" "$evidence_staging/raspberry/kernel/provenance.json"
          copy_evidence "gathered-runtime/raspberry/SHA256SUMS" "$evidence_staging/raspberry/runtime/SHA256SUMS"
          copy_evidence "$orange_image_dir/$prefix-orange-pi-zero-2w.img.xz.sha256" "$evidence_staging/orange/image/$prefix-orange-pi-zero-2w.img.xz.sha256"
          copy_evidence "$orange_image_dir/SHA256SUMS-orange-pi-zero-2w.txt" "$evidence_staging/orange/image/SHA256SUMS-orange-pi-zero-2w.txt"
          copy_evidence "$orange_image_dir/$orange_kernel_image" "$evidence_staging/orange/kernel/$orange_kernel_image"
          copy_evidence "$orange_image_dir/$orange_kernel_dtb" "$evidence_staging/orange/kernel/$orange_kernel_dtb"
          copy_evidence "$orange_image_dir/octessera-orange-kernel-evidence.env" "$evidence_staging/orange/kernel/octessera-orange-kernel-evidence.env"
          copy_evidence "$orange_image_dir/octessera-orange-kernel-provenance.txt" "$evidence_staging/orange/kernel/octessera-orange-kernel-provenance.txt"
          copy_evidence "$orange_image_dir/octessera-orange-image-proof.json" "$evidence_staging/orange/image/octessera-orange-image-proof.json"
          copy_evidence "$orange_device_dir/$orange_device_sums" "$evidence_staging/orange/device/$orange_device_sums"
          copy_evidence "gathered-runtime/orange/SHA256SUMS" "$evidence_staging/orange/runtime/SHA256SUMS"
          python3 tools/legal/package_notice_zip.py --repository-root . --output "$evidence_staging/legal/$prefix-notices.zip"
          python3 tools/legal/verify_notice_archive.py --repository-root . --archive "$evidence_staging/legal/$prefix-notices.zip"
          evidence_zip="$release_assets/$prefix-release-evidence.zip"
          (cd "$evidence_staging" && zip -9 -r "$evidence_zip" windows ubuntu raspberry orange legal)
          unzip -t "$evidence_zip" >/dev/null
          expected_root_assets=(
            "$prefix-windows-installer.exe"
            "$prefix-windows-portable.zip"
            "$prefix-ubuntu-amd64.deb"
            "$prefix-ubuntu-x86_64.AppImage"
            "$prefix-raspberry-pi-zero-2w.img.zip"
            "$rpi_manifest"
            "$rpi_device_zip"
            "$rpi_device_sums"
            "$prefix-orange-pi-zero-2w.img.xz"
            "$orange_device_zip"
            "$prefix-release-evidence.zip"
            "SHA256SUMS.txt"
          )
          expected_count=12
          mapfile -t root_payloads < <(printf '%s\n' "${expected_root_assets[@]}" | grep -v '^SHA256SUMS\.txt$' | LC_ALL=C sort)
          (cd "$release_assets" && sha256sum "${root_payloads[@]}" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          mapfile -t final_files < <(find "$release_assets" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          mapfile -t expected_files < <(printf '%s\n' "${expected_root_assets[@]}" | LC_ALL=C sort)
          [[ "${#final_files[@]}" == "$expected_count" && "${final_files[*]}" == "${expected_files[*]}" ]] || { echo "Unexpected final release asset set: ${final_files[*]}" >&2; exit 1; }
      - name: Revalidate exact draft immediately before upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ needs.release_info.outputs.release_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.release_info.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.release_info.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          [[ "$(jq -r '.id' <<< "$release_json")" == "$EXPECTED_RELEASE_ID" ]] || { echo 'Release ID changed before upload.' >&2; exit 1; }
          [[ "$(jq -r '.tag_name' <<< "$release_json")" == "$EXPECTED_RELEASE_TAG" ]] || { echo 'Release tag changed before upload.' >&2; exit 1; }
          [[ "$(jq -r '.draft' <<< "$release_json")" == true ]] || { echo 'Release is no longer a draft before upload.' >&2; exit 1; }
          [[ "$(jq -r '.assets | length' <<< "$release_json")" == 0 ]] || { echo 'Release already has assets before upload.' >&2; exit 1; }
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$EXPECTED_RELEASE_TAG")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == tag ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          fi
          [[ "$tag_object" == "$EXPECTED_SOURCE_SHA" && "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]] || { echo 'Release tag/source SHA changed before upload.' >&2; exit 1; }
      - name: Upload assets without collision hiding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release_info.outputs.tag }}" ./release-assets/* --repo "$GITHUB_REPOSITORY"
      - name: Revalidate uploaded asset set immediately before publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ needs.release_info.outputs.release_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.release_info.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.release_info.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          [[ "$(jq -r '.id' <<< "$release_json")" == "$EXPECTED_RELEASE_ID" ]] || { echo 'Release ID changed before publish.' >&2; exit 1; }
          [[ "$(jq -r '.tag_name' <<< "$release_json")" == "$EXPECTED_RELEASE_TAG" && "$(jq -r '.draft' <<< "$release_json")" == true ]] || { echo 'Release tag/draft state changed before publish.' >&2; exit 1; }
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$EXPECTED_RELEASE_TAG")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == tag ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          fi
          [[ "$tag_object" == "$EXPECTED_SOURCE_SHA" && "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]] || { echo 'Release tag/source SHA changed before publish.' >&2; exit 1; }
          mapfile -t expected_assets < <(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t uploaded_assets < <(jq -r '.assets[].name' <<< "$release_json" | sort)
          [[ "${#uploaded_assets[@]}" == "${#expected_assets[@]}" && "${uploaded_assets[*]}" == "${expected_assets[*]}" ]] || { echo 'Uploaded release asset names/count do not match the verified set.' >&2; exit 1; }
      - name: Publish the verified draft release last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release_info.outputs.tag }}" --draft=false --repo "$GITHUB_REPOSITORY"
