name: Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag, for example v0.5.0
        required: true
        type: string
concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  workflow_static:
    name: Validate workflow definition from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - run: |
          sudo apt-get update && sudo apt-get install -y shellcheck && test "$(git rev-parse HEAD)" = "${{ github.workflow_sha }}" && python3 tools/release/test_version_consistency.py && python3 tools/release/test_release_asset_assembly.py && python3 tools/release/test_desktop_artifact.py && python3 tools/release/check_version_consistency.py && bash tools/armbian-image/test-release-workflow.sh && bash -n tools/armbian-image/test-release-workflow.sh && shellcheck tools/armbian-image/test-release-workflow.sh

  resolve_draft:
    name: Resolve draft release through the API
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      asset_prefix: ${{ steps.release.outputs.asset_prefix }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Verify exact semver draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Release tag must look like v0.5.0; got $RELEASE_TAG" >&2; exit 1; }
          release_json="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$RELEASE_TAG" '
            [ .[][] | select(.tag_name == $tag) ] as $matches
            | if ($matches | length) != 1 then
                error("Expected exactly one release for tag \($tag)")
              elif $matches[0].draft != true then
                error("The release must remain a draft until manual publication.")
              elif ($matches[0].assets | length) != 0 then
                error("The release draft must not already contain assets.")
              else
                $matches[0]
              end
          ')"
          {
            echo "tag=$RELEASE_TAG"
            echo "version=${RELEASE_TAG#v}"
            echo "asset_prefix=octessera-${RELEASE_TAG#v}"
            echo "release_id=$(jq -r '.id' <<< "$release_json")"
          } >> "$GITHUB_OUTPUT"

  release_info:
    name: Validate immutable release source
    runs-on: ubuntu-latest
    needs: resolve_draft
    outputs:
      tag: ${{ needs.resolve_draft.outputs.tag }}
      version: ${{ needs.resolve_draft.outputs.version }}
      asset_prefix: ${{ needs.resolve_draft.outputs.asset_prefix }}
      release_id: ${{ needs.resolve_draft.outputs.release_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve_draft.outputs.tag }}
          fetch-depth: 0
      - name: Verify tag commit and all application versions
        id: source
        env:
          RELEASE_TAG: ${{ needs.resolve_draft.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve_draft.outputs.version }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release version must be an exact semver.' >&2; exit 1; }
          [[ "$source_sha" == "$(git rev-parse "$RELEASE_TAG^{commit}")" ]] || { echo 'Checked out source does not match the release tag commit.' >&2; exit 1; }
          git tag --points-at HEAD | grep -Fx "$RELEASE_TAG" >/dev/null
          checked_version="$(python3 tools/release/check_version_consistency.py --tag "$RELEASE_TAG")"
          [[ "$checked_version" == "$RELEASE_VERSION" ]] || { echo "Version checker returned $checked_version, expected $RELEASE_VERSION" >&2; exit 1; }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  updater_protocol:
    name: Release updater and workflow static gates
    runs-on: ubuntu-latest
    needs: release_info
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify immutable source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.release_info.outputs.source_sha }}"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run targeted tests and static workflow gates
        run: |
          set -euo pipefail
          python3 -m py_compile tools/device-update/updater_protocol.py tools/device-update/updater_state.py tools/device-update/updater_assets.py tools/device-update/updater_guard.py tools/device-update/updater_cli.py tools/device-update/test_updater_protocol.py tools/device-update/test_updater_layout.py
          python3 -m unittest discover -s tools/device-update -p 'test_*.py'
          bash tools/device-update/smoke-test.sh
          bash tools/armbian-image/test-build-armbian-action.sh
          bash -n tools/device-update/*.sh tools/pi-image/verify-sanitized-image.sh tools/pi-image/verify-rpi-kernel-image.sh tools/pi-kernel/*.sh tools/armbian-image/*.sh
          shellcheck tools/device-update/*.sh tools/pi-kernel/*.sh
          find tools/armbian-image -maxdepth 1 -type f -name '*.sh' ! -name 'test-release-workflow.sh' -exec shellcheck {} +
          cmp tools/device-update/octessera-update tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update
          cmp tools/device-update/octessera-update userpatches/overlay/usr/local/sbin/octessera-update
          cmp tools/device-update/octessera-update-guard tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-guard
          cmp tools/device-update/octessera-update-guard userpatches/overlay/usr/local/sbin/octessera-update-guard
          cmp tools/device-update/octessera-update-recovery tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-recovery
          cmp tools/device-update/octessera-update-recovery userpatches/overlay/usr/local/sbin/octessera-update-recovery
          grep -q 'update-transaction.json' tools/pi/deploy-pi-fast.ps1
      - name: Validate sudoers and systemd units
        run: |
          sudo visudo -cf tools/pi-image/stage4-octessera/files/root/etc/sudoers.d/octessera-update
          sudo visudo -cf userpatches/overlay/etc/sudoers.d/octessera-update
          root="$(mktemp -d)"
          mkdir -p "$root/etc/systemd/system"
          printf '%s\n' '[Unit]' 'Description=Release validation sysinit target' > "$root/etc/systemd/system/sysinit.target"
          printf '%s\n' '[Unit]' 'Description=Release validation local filesystem target' > "$root/etc/systemd/system/local-fs.target"
          install -D -m 0755 tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-guard "$root/usr/local/sbin/octessera-update-guard"
          install -D -m 0755 tools/pi-image/stage4-octessera/files/root/usr/local/sbin/octessera-update-recovery "$root/usr/local/sbin/octessera-update-recovery"
          install -D -m 0644 tools/pi-image/stage4-octessera/files/root/etc/systemd/system/octessera-update-guard.service "$root/etc/systemd/system/octessera-update-guard.service"
          install -D -m 0644 tools/pi-image/stage4-octessera/files/root/etc/systemd/system/octessera-update-recovery.service "$root/etc/systemd/system/octessera-update-recovery.service"
          if grep -q '^ConditionPathExists=' tools/pi-image/stage4-octessera/files/root/etc/systemd/system/octessera-update-recovery.service; then
            echo 'Recovery units must not use ConditionPathExists.' >&2
            exit 1
          fi
          if grep -q '^ConditionPathExists=' userpatches/overlay/etc/systemd/system/octessera-update-recovery.service; then
            echo 'Recovery units must not use ConditionPathExists.' >&2
            exit 1
          fi
          systemd-analyze --root="$root" verify octessera-update-guard.service octessera-update-recovery.service
          rm -rf "$root"

  windows:
    name: Windows installer and portable EXE
    runs-on: windows-latest
    needs: release_info
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
      - name: Verify immutable source checkout
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne "${{ needs.release_info.outputs.source_sha }}") { throw 'Immutable source checkout does not match source_sha.' }
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run tauri:build
      - name: Prepare Windows assets
        shell: pwsh
        run: |
          $assetDir = New-Item -ItemType Directory -Force -Path "release-assets"
          $installers = @(Get-ChildItem -Path "target/release/bundle/nsis" -Filter "*.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer, found $($installers.Count)" }
          $portable = "target/release/octessera-desktop.exe"
          if (-not (Test-Path -LiteralPath $portable)) { throw "Portable executable source not found" }
          $installerAsset = Join-Path $assetDir "${{ needs.release_info.outputs.asset_prefix }}-windows-installer.exe"
          $portableAsset = Join-Path $assetDir "${{ needs.release_info.outputs.asset_prefix }}-windows-portable.zip"
          Copy-Item -LiteralPath $installers[0].FullName -Destination $installerAsset
          python tools/legal/package_portable_zip.py --repository-root . --executable $portable --output $portableAsset
          python tools/legal/verify_notice_archive.py --repository-root . --archive $portableAsset --payload-name octessera.exe
          $files = @(Get-ChildItem -LiteralPath $assetDir -File)
          if ($files.Count -ne 2) { throw "Expected exactly two Windows payload files" }
          $lines = $files | ForEach-Object { $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLower(); "$hash  $($_.Name)" }
          $lines | Set-Content -LiteralPath (Join-Path $assetDir "SHA256SUMS-windows.txt")
      - name: Verify Windows portable and NSIS resource trees
        shell: pwsh
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "octessera-nsis-resource-check"
          if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          try {
            $portable = "release-assets/${{ needs.release_info.outputs.asset_prefix }}-windows-portable.zip"
            python tools/release/verify_desktop_artifact.py --repository-root . --portable-zip $portable --executable "target/release/octessera-desktop.exe"
            $installer = (Resolve-Path "release-assets/${{ needs.release_info.outputs.asset_prefix }}-windows-installer.exe").Path
            $sevenZip = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path -LiteralPath $sevenZip -PathType Leaf)) { throw "Required 7-Zip executable was not found at $sevenZip" }
            $sevenZip = (Resolve-Path -LiteralPath $sevenZip).Path
            & $sevenZip x $installer "-o$installRoot" -y
            if ($LASTEXITCODE -ne 0) { throw "NSIS archive extraction with 7-Zip exited with code $LASTEXITCODE" }
            $candidates = @((Get-Item -LiteralPath $installRoot)) + @(Get-ChildItem -LiteralPath $installRoot -Directory -Recurse -Force)
            $resourceRoots = @(
              $candidates | Where-Object {
                (Test-Path -LiteralPath (Join-Path $_.FullName "samples") -PathType Container) -and
                (Test-Path -LiteralPath (Join-Path $_.FullName "legal") -PathType Container)
              }
            )
            if ($resourceRoots.Count -ne 1) { throw "Expected exactly one extracted direct samples/legal resource root, found $($resourceRoots.Count)" }
            python tools/release/verify_desktop_artifact.py --repository-root . --resource-root $resourceRoots[0].FullName
          } finally {
            if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-windows-release-assets
          path: ./release-assets/*
          if-no-files-found: error

  ubuntu:
    name: Ubuntu DEB and AppImage
    runs-on: ubuntu-22.04
    needs: release_info
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
      - name: Verify immutable source checkout
        run: test "$(git rev-parse HEAD)" = "${{ needs.release_info.outputs.source_sha }}"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libayatana-appindicator3-dev libasound2-dev libfuse2 librsvg2-dev libsoup-3.0-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config wget xdg-utils
      - run: pnpm install --frozen-lockfile
      - run: APPIMAGE_EXTRACT_AND_RUN=1 corepack pnpm --dir apps/desktop exec tauri build --bundles deb,appimage
      - name: Prepare Ubuntu assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          mapfile -t deb_files < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print | sort)
          mapfile -t appimage_files < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print | sort)
          [[ "${#deb_files[@]}" == 1 ]] || { echo "Expected exactly one Ubuntu DEB, found ${#deb_files[@]}." >&2; exit 1; }
          [[ "${#appimage_files[@]}" == 1 ]] || { echo "Expected exactly one Ubuntu AppImage, found ${#appimage_files[@]}." >&2; exit 1; }
          deb_asset="$GITHUB_WORKSPACE/release-assets/${{ needs.release_info.outputs.asset_prefix }}-ubuntu-amd64.deb"
          appimage_asset="$GITHUB_WORKSPACE/release-assets/${{ needs.release_info.outputs.asset_prefix }}-ubuntu-x86_64.AppImage"
          cp "${deb_files[0]}" "$deb_asset"
          cp "${appimage_files[0]}" "$appimage_asset"
          (cd release-assets && sha256sum ./*.deb ./*.AppImage > SHA256SUMS-ubuntu.txt)
      - name: Verify Ubuntu DEB and AppImage resource trees
        run: |
          set -euo pipefail
          extracted_root="$(mktemp -d)"
          trap 'rm -rf "$extracted_root"' EXIT
          deb_root="$extracted_root/deb"
          appimage_root="$extracted_root/appimage"
          mkdir -p "$deb_root" "$appimage_root"
          dpkg-deb -x "release-assets/${{ needs.release_info.outputs.asset_prefix }}-ubuntu-amd64.deb" "$deb_root"
          python3 tools/release/verify_desktop_artifact.py --repository-root . --resource-root "$deb_root/usr/lib/octessera"
          (
            cd "$appimage_root"
            APPIMAGE_EXTRACT_AND_RUN=1 "$GITHUB_WORKSPACE/release-assets/${{ needs.release_info.outputs.asset_prefix }}-ubuntu-x86_64.AppImage" --appimage-extract
          )
          python3 tools/release/verify_desktop_artifact.py --repository-root . --resource-root "$appimage_root/squashfs-root/usr/lib/octessera"
      - uses: actions/upload-artifact@v4
        with:
          name: octessera-ubuntu-release-assets
          path: ./release-assets/*
          if-no-files-found: error

  board_artifacts:
    name: Board runtime, kernel, image, and device gates
    needs: release_info
    uses: ./.github/workflows/release-board-artifacts.yml
    with:
      tag: ${{ needs.release_info.outputs.tag }}
      version: ${{ needs.release_info.outputs.version }}
      source_sha: ${{ needs.release_info.outputs.source_sha }}
    secrets: inherit

  publish_release_assets:
    name: Verify and upload assets; preserve draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      draft_ready: ${{ steps.draft_handoff.outputs.draft_ready }}
    needs: [release_info, updater_protocol, windows, ubuntu, board_artifacts, workflow_static]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_info.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify source and install final image proof dependencies
        run: test "$(git rev-parse HEAD)" = "${{ needs.release_info.outputs.source_sha }}" && sudo apt-get update && sudo apt-get install -y --no-install-recommends cpio zstd
      - name: Download release artifacts into board-separated directories
        uses: actions/download-artifact@v4
        with:
          pattern: octessera-*-release-assets
          path: gathered-release-assets
          merge-multiple: false
      - uses: actions/download-artifact@v4
        with:
          name: octessera-raspberry-runtime
          path: gathered-runtime/raspberry
      - uses: actions/download-artifact@v4
        with:
          name: octessera-orange-runtime
          path: gathered-runtime/orange
      - name: Assemble and verify exact release assets
        env:
          RELEASE_VERSION: ${{ needs.release_info.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ needs.release_info.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 tools/release/assemble_release_assets.py \
            --repository-root . \
            --gathered-root "$GITHUB_WORKSPACE/gathered-release-assets" \
            --raspberry-runtime "$GITHUB_WORKSPACE/gathered-runtime/raspberry" \
            --orange-runtime "$GITHUB_WORKSPACE/gathered-runtime/orange" \
            --release-assets "$GITHUB_WORKSPACE/release-assets" \
            --evidence-staging "$GITHUB_WORKSPACE/release-evidence" \
            --version "$RELEASE_VERSION" \
            --source-sha "$RELEASE_SOURCE_SHA"
      - name: Revalidate exact draft immediately before upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ needs.release_info.outputs.release_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.release_info.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.release_info.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          [[ "$(jq -r '.id' <<< "$release_json")" == "$EXPECTED_RELEASE_ID" ]] || { echo 'Release ID changed before upload.' >&2; exit 1; }
          [[ "$(jq -r '.tag_name' <<< "$release_json")" == "$EXPECTED_RELEASE_TAG" ]] || { echo 'Release tag changed before upload.' >&2; exit 1; }
          [[ "$(jq -r '.draft' <<< "$release_json")" == true ]] || { echo 'Release is no longer a draft before upload.' >&2; exit 1; }
          [[ "$(jq -r '.assets | length' <<< "$release_json")" == 0 ]] || { echo 'Release already has assets before upload.' >&2; exit 1; }
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$EXPECTED_RELEASE_TAG")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == tag ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          fi
          [[ "$tag_object" == "$EXPECTED_SOURCE_SHA" && "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]] || { echo 'Release tag/source SHA changed before upload.' >&2; exit 1; }
      - name: Upload assets without collision hiding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release_info.outputs.tag }}" ./release-assets/* --repo "$GITHUB_REPOSITORY"
      - name: Revalidate uploaded asset set after upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_RELEASE_ID: ${{ needs.release_info.outputs.release_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.release_info.outputs.tag }}
          EXPECTED_SOURCE_SHA: ${{ needs.release_info.outputs.source_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$EXPECTED_RELEASE_ID")"
          [[ "$(jq -r '.id' <<< "$release_json")" == "$EXPECTED_RELEASE_ID" ]] || { echo 'Release ID changed after upload.' >&2; exit 1; }
          [[ "$(jq -r '.tag_name' <<< "$release_json")" == "$EXPECTED_RELEASE_TAG" && "$(jq -r '.draft' <<< "$release_json")" == true ]] || { echo 'Release tag/draft state changed after upload.' >&2; exit 1; }
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$EXPECTED_RELEASE_TAG")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == tag ]]; then
            tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.object.sha')"
          fi
          [[ "$tag_object" == "$EXPECTED_SOURCE_SHA" && "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]] || { echo 'Release tag/source SHA changed after upload.' >&2; exit 1; }
          mapfile -t expected_assets < <(
            while IFS= read -r name; do
              printf '%s\t%s\n' "$name" "$(stat -c '%s' "release-assets/$name")"
            done < <(find release-assets -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          )
          mapfile -t uploaded_assets < <(jq -r '.assets[] | [.name, (.size | tostring)] | @tsv' <<< "$release_json" | sort)
          [[ "${#uploaded_assets[@]}" == "${#expected_assets[@]}" && "${uploaded_assets[*]}" == "${expected_assets[*]}" ]] || { echo 'Uploaded release asset names/count/sizes do not match the verified set.' >&2; exit 1; }
      - name: Report populated draft ready for manual FAT and publication
        id: draft_handoff
        run: |
          {
            echo "## Populated draft ready for manual exact-artifact FAT and human publication"
            echo
            echo "- Tag: ${{ needs.release_info.outputs.tag }}"
            echo "- local bytes/checksums were verified before upload; remote names/count/sizes were revalidated; downloaded bytes/checksums and exact-artifact FAT remain human gates before publication."
            echo "- The GitHub release remains a draft and is ready for those manual gates before publication."
          } >> "$GITHUB_STEP_SUMMARY"
          echo 'draft_ready=true' >> "$GITHUB_OUTPUT"
