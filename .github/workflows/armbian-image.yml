name: Armbian Image

on:
  workflow_dispatch:
    inputs:
      board:
        description: Armbian board slug
        required: true
        default: orangepizero2w
      release:
        description: Armbian release
        required: true
        default: trixie
      kernel_branch:
        description: Armbian kernel branch
        required: true
        default: current
      ui:
        description: "Armbian UI target: minimal, server, or desktop environment name"
        required: true
        default: minimal
      compression:
        description: Armbian COMPRESS_OUTPUTIMAGE value
        required: true
        default: sha,img,xz
      extensions:
        description: Space-separated Armbian extensions; Octessera MIDI and image sanitization are mandatory, and preset-firstrun enables first-run presets
        required: false
        default: preset-firstrun octessera_midi octessera_image_sanitize
      armbian_build_ref:
        description: Reviewed immutable armbian/build commit SHA for image builds; mutable refs are validation-only
        required: true
        default: main
      run_build:
        description: Run the full Armbian build after validation
        required: true
        type: boolean
        default: false
      artifact_mode:
        description: Artifact policy
        required: true
        type: choice
        options:
          - public-generic
          - private-personalized
        default: public-generic
      public_inputs:
        description: Optional JSON object with public preset/payload inputs
        required: false
        default: '{}'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Armbian image inputs and payload
    runs-on: ubuntu-latest
    outputs:
      public_preset_configuration_url: ${{ steps.public-inputs.outputs.public_preset_configuration_url }}
      payload_url: ${{ steps.public-inputs.outputs.payload_url }}
      payload_sha256: ${{ steps.public-inputs.outputs.payload_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate public JSON inputs
        id: public-inputs
        env:
          PUBLIC_INPUTS: ${{ inputs.public_inputs }}
        run: |
          set -euo pipefail
          if ! jq -e '
            def safe_string($max):
              type == "string" and length <= $max and (test("[\\r\\n]") | not);
            type == "object"
              and ((keys - ["public_preset_configuration_url", "payload_url", "payload_sha256"]) | length == 0)
              and ((.public_preset_configuration_url // "") | safe_string(2048))
              and ((.payload_url // "") | safe_string(2048))
              and ((.payload_sha256 // "") | safe_string(128))
          ' <<< "$PUBLIC_INPUTS" >/dev/null; then
            echo 'public_inputs must contain only bounded, single-line string values for the documented public keys.' >&2
            exit 1
          fi
          {
            jq -r '"public_preset_configuration_url=" + (.public_preset_configuration_url // "")' <<< "$PUBLIC_INPUTS"
            jq -r '"payload_url=" + (.payload_url // "")' <<< "$PUBLIC_INPUTS"
            jq -r '"payload_sha256=" + (.payload_sha256 // "")' <<< "$PUBLIC_INPUTS"
          } >> "$GITHUB_OUTPUT"
      - name: Install workflow linters
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio device-tree-compiler initramfs-tools shellcheck zstd
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate repository Armbian image payload
        env:
          ARMBIAN_BOARD: ${{ inputs.board }}
          ARMBIAN_BUILD_REF: ${{ inputs.armbian_build_ref }}
          ARMBIAN_RUN_BUILD: ${{ inputs.run_build }}
          ARMBIAN_EXTENSIONS: ${{ inputs.extensions }}
          PUBLIC_PRESET_CONFIGURATION_URL: ${{ steps.public-inputs.outputs.public_preset_configuration_url }}
          PAYLOAD_URL: ${{ steps.public-inputs.outputs.payload_url }}
          PAYLOAD_SHA256: ${{ steps.public-inputs.outputs.payload_sha256 }}
        run: bash tools/armbian-image/validate.sh

  build-generic:
    name: Build generic Armbian image
    needs: validate
    if: ${{ inputs.run_build && inputs.artifact_mode == 'public-generic' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
      - name: Build generic image
        uses: ./custom/.github/actions/build-armbian-image
        with:
          board: ${{ inputs.board }}
          release: ${{ inputs.release }}
          kernel_branch: ${{ inputs.kernel_branch }}
          ui: ${{ inputs.ui }}
          compression: ${{ inputs.compression }}
          extensions: ${{ inputs.extensions }}
          armbian_build_ref: ${{ inputs.armbian_build_ref }}
          boot_proof_mode: phase5-constructor
          construction_contract: resources/image-construction/boot-layers/orange-pi-zero-2w.json
          share_log: yes
        env:
          PRESET_CONFIGURATION: ${{ needs.validate.outputs.public_preset_configuration_url }}
          PUBLIC_PRESET_CONFIGURATION_URL: ${{ needs.validate.outputs.public_preset_configuration_url }}
          OCTESSERA_PAYLOAD_URL: ${{ needs.validate.outputs.payload_url }}
          OCTESSERA_PAYLOAD_SHA256: ${{ needs.validate.outputs.payload_sha256 }}
      - name: Upload generic image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: octessera-armbian-${{ inputs.board }}-${{ inputs.release }}
          path: ./build/output/images/*
          if-no-files-found: error
          retention-days: 14

  build-personalized:
    name: Build private personalized Armbian image
    needs: validate
    if: ${{ inputs.run_build && inputs.artifact_mode == 'private-personalized' && github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    environment: armbian-image-personalized
    steps:
      - uses: actions/checkout@v4
        with:
          path: custom
      - name: Reject public first-run input in private mode
        if: ${{ needs.validate.outputs.public_preset_configuration_url != '' }}
        run: |
          echo 'Use protected environment secrets, not public workflow inputs, for private PRESET_CONFIGURATION URLs.' >&2
          exit 1
      - name: Validate private first-run extension
        env:
          PRIVATE_PRESET_CONFIGURATION_URL: ${{ secrets.ARMBIAN_PRESET_CONFIGURATION_URL }}
          ARMBIAN_EXTENSIONS: ${{ inputs.extensions }}
        run: |
          if [ -z "$PRIVATE_PRESET_CONFIGURATION_URL" ]; then
            exit 0
          fi
          case " $ARMBIAN_EXTENSIONS " in
            *' preset-firstrun '*) exit 0 ;;
          esac
          echo 'ARMBIAN_PRESET_CONFIGURATION_URL requires the preset-firstrun extension.' >&2
          exit 1
      - name: Validate private build ref and payload inputs
        env:
          ARMBIAN_BUILD_REF: ${{ inputs.armbian_build_ref }}
          PRIVATE_PAYLOAD_URL: ${{ secrets.OCTESSERA_PRIVATE_PAYLOAD_URL }}
          PRIVATE_PAYLOAD_SHA256: ${{ secrets.OCTESSERA_PRIVATE_PAYLOAD_SHA256 }}
        run: |
          set -euo pipefail
          if ! [[ "$ARMBIAN_BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'Private personalized builds require a reviewed full Armbian commit SHA.' >&2
            exit 1
          fi
          if [ -n "$PRIVATE_PAYLOAD_URL" ] && [ -z "$PRIVATE_PAYLOAD_SHA256" ]; then
            echo 'OCTESSERA_PRIVATE_PAYLOAD_SHA256 is required when OCTESSERA_PRIVATE_PAYLOAD_URL is set.' >&2
            exit 1
          fi
          if [ -z "$PRIVATE_PAYLOAD_URL" ] && [ -n "$PRIVATE_PAYLOAD_SHA256" ]; then
            echo 'OCTESSERA_PRIVATE_PAYLOAD_URL is required when OCTESSERA_PRIVATE_PAYLOAD_SHA256 is set.' >&2
            exit 1
          fi
      - name: Mask private values
        env:
          PRIVATE_PRESET_CONFIGURATION_URL: ${{ secrets.ARMBIAN_PRESET_CONFIGURATION_URL }}
          PRIVATE_PAYLOAD_URL: ${{ secrets.OCTESSERA_PRIVATE_PAYLOAD_URL }}
          PRIVATE_PAYLOAD_SHA256: ${{ secrets.OCTESSERA_PRIVATE_PAYLOAD_SHA256 }}
        run: |
          printf '%s\n' "::add-mask::$PRIVATE_PRESET_CONFIGURATION_URL"
          printf '%s\n' "::add-mask::$PRIVATE_PAYLOAD_URL"
          printf '%s\n' "::add-mask::$PRIVATE_PAYLOAD_SHA256"
      - name: Build personalized image
        uses: ./custom/.github/actions/build-armbian-image
        with:
          board: ${{ inputs.board }}
          release: ${{ inputs.release }}
          kernel_branch: ${{ inputs.kernel_branch }}
          ui: ${{ inputs.ui }}
          compression: ${{ inputs.compression }}
          extensions: ${{ inputs.extensions }}
          armbian_build_ref: ${{ inputs.armbian_build_ref }}
          boot_proof_mode: phase5-constructor
          construction_contract: resources/image-construction/boot-layers/orange-pi-zero-2w.json
          share_log: no
        env:
          PRESET_CONFIGURATION: ${{ secrets.ARMBIAN_PRESET_CONFIGURATION_URL }}
          OCTESSERA_PAYLOAD_URL: ${{ secrets.OCTESSERA_PRIVATE_PAYLOAD_URL }}
          OCTESSERA_PAYLOAD_SHA256: ${{ secrets.OCTESSERA_PRIVATE_PAYLOAD_SHA256 }}
      - name: Upload private image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PRIVATE-octessera-armbian-${{ inputs.board }}-${{ inputs.release }}
          path: ./build/output/images/*
          if-no-files-found: error
          retention-days: 2
