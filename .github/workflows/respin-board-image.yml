name: Respin board image

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board image to respin
        required: true
        type: choice
        options:
          - raspberry-pi-zero-2w
          - orange-pi-zero-2w
      setup_layer:
        description: Optional non-publishing setup portal layer (runtime-only is the default)
        required: true
        default: runtime-only
        type: choice
        options:
          - runtime-only
          - setup-portal

permissions:
  contents: read

jobs:
  respin:
    name: Respin ${{ inputs.board }} image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BOARD: ${{ inputs.board }}
      SETUP_LAYER: ${{ inputs.setup_layer }}
      SOURCE_SHA: ${{ github.sha }}
      TRUST_MANIFEST: resources/image-parents/v0.7.5-trust-manifest.json
      BOOT_NEUTRAL_CONTRACT: resources/image-derivations/boot-neutral/orange-pi-zero-2w-v0.7.5.json
      ORANGE_PARENT_IMAGE: parent-assets/octessera-0.7.5-orange-pi-zero-2w.img.xz
      PARENT_ASSETS: parent-assets
      RUNTIME_BUNDLE: runtime-bundle
      RESPIN_OUTPUT: respin-output
    steps:
      - name: Checkout immutable workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify immutable source and current application version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          version="$(python3 tools/release/check_version_consistency.py)"
          echo "OCTESSERA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate checked trust manifest
        run: python3 tools/image-respin/verify-parent-release.py --manifest "$TRUST_MANIFEST" --validate-manifest

      - name: Install image respin dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cpio dosfstools e2fsprogs initramfs-tools-core kpartx unzip util-linux xz-utils zstd

      - name: Setup Rust cross target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install pinned cross
        env:
          CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' "$CROSS_SHA256" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin
          cross --version

      - name: Build selected runtime exactly once
        run: |
          set -euo pipefail
          docker pull rust:1-bookworm
          case "$BOARD" in
            raspberry-pi-zero-2w)
              feature_command='cross build --release --locked --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-raspberry-pi-zero-2w'
              cross build --release --locked --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-raspberry-pi-zero-2w
              ;;
            orange-pi-zero-2w)
              feature_command='cross build --release --locked --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-orange-pi-zero-2w'
              cross build --release --locked --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-orange-pi-zero-2w
              ;;
            *)
              echo "Unsupported board: $BOARD" >&2
              exit 1
              ;;
          esac
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "FEATURE_COMMAND=$feature_command" >> "$GITHUB_ENV"

      - name: Create exact production runtime bundle
        run: |
          set -euo pipefail
          python3 tools/image-respin/runtime_bundle.py \
            --binary target/aarch64-unknown-linux-gnu/release/octessera-pi \
            --board "$BOARD" \
            --version "$OCTESSERA_VERSION" \
            --output "$RUNTIME_BUNDLE"

      - name: Record requested build identity
        run: |
          set -euo pipefail
          mkdir -p "$RESPIN_OUTPUT"
          rustc -vV > "$RUNNER_TEMP/rustc-vV.txt"
          cargo --version > "$RUNNER_TEMP/cargo-version.txt"
          cross --version > "$RUNNER_TEMP/cross-version.txt"
          docker run --rm octessera-pi-cross rustc -vV > "$RUNNER_TEMP/container-rustc-vV.txt"
          docker run --rm octessera-pi-cross cargo --version > "$RUNNER_TEMP/container-cargo-version.txt"
          cross_image_id="$(docker image inspect octessera-pi-cross --format '{{.Id}}')"
          cross_image_repo_digests="$(docker image inspect octessera-pi-cross --format '{{json .RepoDigests}}')"
          base_image_id="$(docker image inspect rust:1-bookworm --format '{{.Id}}')"
          base_image_repo_digests="$(docker image inspect rust:1-bookworm --format '{{json .RepoDigests}}')"
          [[ -n "$cross_image_id" && -n "$base_image_id" ]] || { echo "Required Docker image identity is missing" >&2; exit 1; }
          package_args=()
          for package in cpio zstd dosfstools e2fsprogs initramfs-tools-core kpartx unzip util-linux xz-utils; do
            status="$(dpkg-query -W -f='${Status}' "$package")"
            [[ "$status" == 'install ok installed' ]] || { echo "Required proof package is not installed: $package" >&2; exit 1; }
            package_version="$(dpkg-query -W -f='${Version}' "$package")"
            [[ -n "$package_version" ]] || { echo "Required proof package version is missing: $package" >&2; exit 1; }
            package_args+=(--proof-package "$package=$package_version")
          done
          setup_record_args=()
          if [[ "$SETUP_LAYER" == setup-portal ]]; then
            setup_contract="resources/image-mutations/$BOARD-setup.json"
            setup_record_args+=(--setup-layer setup-portal --setup-contract "$setup_contract" --setup-input-file "$setup_contract" --strict-setup-source-tracking)
            mapfile -t setup_sources < <(python3 - "$setup_contract" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              for item in json.load(handle)["source_inputs"]:
                  print(item["path"])
          PY
            )
            for path in "${setup_sources[@]}"; do setup_record_args+=(--setup-input-file "$path"); done
            for path in tools/image-respin/inventory.py tools/image-respin/provenance.py tools/image-respin/runtime_contract_schema.py tools/image-respin/runtime_contract.py tools/image-respin/runtime_payload.py tools/image-respin/runtime_transaction.py tools/image-respin/runtime_mutation.py tools/image-respin/disk_layout.py tools/image-respin/disk_mount.py tools/image-respin/disk_packaging.py tools/image-respin/disk_provenance.py tools/image-respin/setup_contract_schema.py tools/image-respin/setup_contract.py tools/image-respin/setup_provenance.py tools/image-respin/setup_mutation.py tools/image-respin/setup_proof.py tools/image-respin/disk_setup_respin.py tools/image-respin/boot_neutral.py tools/image-respin/setup_workflow_record.py tools/image-respin/workflow_records.py tools/image-respin/requested_build_record.py tools/image-respin/post_proof_record.py tools/image-respin/trust_manifest.py tools/image-respin/record_validation.py tools/image-respin/record_hashing.py tools/image-respin/record_paths.py tools/image-respin/record_documents.py tools/image-respin/record_tool_contract.py; do
              setup_record_args+=(--setup-input-file "$path")
            done
          fi
          python3 tools/image-respin/workflow_records.py requested \
            --source-sha "$SOURCE_SHA" \
            --version "$OCTESSERA_VERSION" \
            --board "$BOARD" \
            --feature-command "$FEATURE_COMMAND" \
            --input-file Cargo.lock \
            --input-file Cargo.toml \
            --input-file package.json \
            --input-file pnpm-workspace.yaml \
            --input-file apps/desktop/package.json \
            --input-file packages/device-contracts/package.json \
            --input-file apps/desktop/src-tauri/Cargo.toml \
            --input-file apps/desktop/src-tauri/tauri.conf.json \
            --input-file crates/platform-capabilities-build/Cargo.toml \
            --input-file crates/platform-core/Cargo.toml \
            --input-file crates/playback-runtime/Cargo.toml \
            --input-file crates/realtime-engine/Cargo.toml \
            --input-file crates/rodio-engine-source/Cargo.toml \
            --input-file crates/hal/Cargo.toml \
            --input-file apps/pi-zero/Cargo.toml \
            --input-file Cross.toml \
            --input-file Dockerfile.pi-zero \
            --input-file .github/workflows/respin-board-image.yml \
            --input-file tools/image-respin/runtime_bundle.py \
            --input-file tools/image-respin/boot_neutral.py \
            --input-file tools/release/check_version_consistency.py \
            --input-file resources/legal/notice-bundle.json \
            --input-file tools/legal/stage_notices.py \
            --input-file tools/image-respin/notice_mutation.py \
            --trust-manifest "$TRUST_MANIFEST" \
            --rustc-version-file "$RUNNER_TEMP/rustc-vV.txt" \
            --cargo-version-file "$RUNNER_TEMP/cargo-version.txt" \
            --cross-version-file "$RUNNER_TEMP/cross-version.txt" \
            --container-rustc-version-file "$RUNNER_TEMP/container-rustc-vV.txt" \
            --container-cargo-version-file "$RUNNER_TEMP/container-cargo-version.txt" \
            --cross-image-id "$cross_image_id" \
            --cross-image-repo-digests "$cross_image_repo_digests" \
            --base-image-id "$base_image_id" \
            --base-image-repo-digests "$base_image_repo_digests" \
            "${package_args[@]}" \
            "${setup_record_args[@]}" \
            --root "$GITHUB_WORKSPACE" \
            --output "$RESPIN_OUTPUT/requested-build.json"

      - name: Fetch and validate the exact v0.7.5 parent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/octessera-v0.7.5-release.json"
          gh api "repos/nexxyz/octessera/releases/tags/v0.7.5" > "$release_json"
          jq -e '.draft == false and .prerelease == false' "$release_json" >/dev/null
          python3 tools/image-respin/verify-parent-release.py --manifest "$TRUST_MANIFEST" --live-respin-release-json "$release_json"
          trusted_source="$(python3 - "$TRUST_MANIFEST" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["release"]["source_commit"])
          PY
          )"
          tag_ref="$(gh api "repos/nexxyz/octessera/git/ref/tags/v0.7.5")"
          tag_type="$(jq -r '.object.type' <<< "$tag_ref")"
          tag_object="$(jq -r '.object.sha' <<< "$tag_ref")"
          if [[ "$tag_type" == tag ]]; then
            tag_object="$(gh api "repos/nexxyz/octessera/git/tags/$tag_object" --jq '.object.sha')"
          elif [[ "$tag_type" != commit ]]; then
            echo "v0.7.5 does not resolve to a commit or annotated tag" >&2
            exit 1
          fi
          [[ "$tag_object" == "$trusted_source" ]] || { echo "v0.7.5 tag commit is not the trusted source commit" >&2; exit 1; }

      - name: Download exact selected board assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$PARENT_ASSETS"
          mkdir -p "$PARENT_ASSETS"
          release_json="$RUNNER_TEMP/octessera-v0.7.5-release.json"
          mapfile -t asset_names < <(python3 tools/image-respin/verify-parent-release.py --manifest "$TRUST_MANIFEST" --print-board-assets --board "$BOARD")
          [[ "${#asset_names[@]}" -gt 0 ]] || { echo "No trusted assets selected" >&2; exit 1; }
          printf '%s\n' "${asset_names[@]}"
          for asset_name in "${asset_names[@]}"; do
            [[ "$asset_name" != */* && "$asset_name" != *\\* ]] || { echo "Unsafe trusted asset name: $asset_name" >&2; exit 1; }
            asset_id="$(jq -r --arg name "$asset_name" '[.assets[] | select(.name == $name) | .id] | if length == 1 then .[0] else empty end' "$release_json")"
            [[ "$asset_id" =~ ^[0-9]+$ ]] || { echo "No exact release asset ID for $asset_name" >&2; exit 1; }
            destination="$PARENT_ASSETS/$asset_name"
            [[ ! -e "$destination" && ! -L "$destination" ]] || { echo "Refusing to clobber $destination" >&2; exit 1; }
            temporary="$(mktemp "$PARENT_ASSETS/.octessera-asset.XXXXXX")"
            if ! gh api --header 'Accept: application/octet-stream' "repos/nexxyz/octessera/releases/assets/$asset_id" > "$temporary"; then
              rm -f "$temporary"
              exit 1
            fi
            mv -n -- "$temporary" "$destination"
            test ! -e "$temporary" && test -f "$destination"
          done
          python3 tools/image-respin/verify-parent-release.py --manifest "$TRUST_MANIFEST" --directory "$PARENT_ASSETS" --board "$BOARD"

      - name: Respin the trusted parent image
        run: |
          set -euo pipefail
          case "$SETUP_LAYER" in
            runtime-only|setup-portal) ;;
            *) echo "Unsupported respin setup layer: $SETUP_LAYER" >&2; exit 1 ;;
          esac
          mkdir -p "$RESPIN_OUTPUT"
          case "$BOARD" in
            raspberry-pi-zero-2w) suffix=.zip ;;
            orange-pi-zero-2w) suffix=.img.xz ;;
            *) exit 1 ;;
          esac
          boot_neutral_args=()
          if [[ "$BOARD" == orange-pi-zero-2w ]]; then
            boot_neutral_args+=(--boot-neutral-contract "$BOOT_NEUTRAL_CONTRACT")
          fi
          if [[ "$SETUP_LAYER" == runtime-only ]]; then
            output="$RESPIN_OUTPUT/octessera-$OCTESSERA_VERSION-$BOARD-derived-runtime-respin$suffix"
            sudo python3 tools/image-respin/disk_respin.py \
              --board "$BOARD" \
              --assets-directory "$PARENT_ASSETS" \
              --manifest "$TRUST_MANIFEST" \
              --runtime-bundle "$RUNTIME_BUNDLE" \
              --version "$OCTESSERA_VERSION" \
              --source-identity "$SOURCE_SHA" \
              "${boot_neutral_args[@]}" \
              --output "$output"
          elif [[ "$SETUP_LAYER" == setup-portal ]]; then
            output="$RESPIN_OUTPUT/octessera-$OCTESSERA_VERSION-$BOARD-derived-setup-respin$suffix"
            setup_proof="$RESPIN_OUTPUT/setup-layer-proof.json"
            sudo python3 tools/image-respin/disk_setup_respin.py \
              --board "$BOARD" \
              --assets-directory "$PARENT_ASSETS" \
              --manifest "$TRUST_MANIFEST" \
              --runtime-bundle "$RUNTIME_BUNDLE" \
              --version "$OCTESSERA_VERSION" \
              --source-identity "$SOURCE_SHA" \
              --output "$output" \
              --proof-output "$setup_proof" \
              "${boot_neutral_args[@]}"
            sudo chown "$(id -u):$(id -g)" "$setup_proof"
            echo "SETUP_PROOF=$setup_proof" >> "$GITHUB_ENV"
          else
            echo "Runtime-only respins cannot invoke the setup mutator." >&2
            exit 1
          fi
          sudo chown "$(id -u):$(id -g)" "$output" "$output.provenance.json"
          echo "RESPIN_ARTIFACT=$output" >> "$GITHUB_ENV"

      - name: Re-run exact Orange production proof
        if: inputs.board == 'orange-pi-zero-2w'
        run: |
          set -euo pipefail
          proof="$RESPIN_OUTPUT/orange-image-proof.json"
          proof_args=(
            --boot-proof-mode trusted-v0.7.5-boot-neutral
            --boot-neutral-contract "$BOOT_NEUTRAL_CONTRACT"
            --parent-image "$GITHUB_WORKSPACE/$ORANGE_PARENT_IMAGE"
            --trust-manifest "$GITHUB_WORKSPACE/$TRUST_MANIFEST"
            --respin-provenance "$GITHUB_WORKSPACE/$RESPIN_ARTIFACT.provenance.json"
            --derivation-kind "$SETUP_LAYER"
          )
          if [[ "$SETUP_LAYER" == setup-portal ]]; then
            proof_args+=(--setup-proof "$GITHUB_WORKSPACE/$SETUP_PROOF")
          fi
          sudo bash tools/armbian-image/verify-orange-image.sh \
            --image "$GITHUB_WORKSPACE/$RESPIN_ARTIFACT" \
            "${proof_args[@]}" \
            --output "$GITHUB_WORKSPACE/$proof"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/$proof"

      - name: Re-run exact Raspberry production proofs
        if: inputs.board == 'raspberry-pi-zero-2w'
        run: |
          set -euo pipefail
          sanitation_proof="$RESPIN_OUTPUT/raspberry-sanitized-image-proof.txt"
          if [[ "$SETUP_LAYER" == setup-portal ]]; then
            sudo bash tools/pi-image/verify-sanitized-image.sh --verification-profile legacy-setup-layer "$GITHUB_WORKSPACE/$RESPIN_ARTIFACT" 2>&1 | tee "$sanitation_proof"
          else
            sudo bash tools/pi-image/verify-sanitized-image.sh --verification-profile legacy-runtime-only "$GITHUB_WORKSPACE/$RESPIN_ARTIFACT" 2>&1 | tee "$sanitation_proof"
          fi
          sudo chown "$(id -u):$(id -g)" "$sanitation_proof"

      - name: Generate and validate post-proof record
        run: |
          set -euo pipefail
          if [[ "$SETUP_LAYER" == setup-portal ]]; then
            mapfile -t companion_names < <(python3 tools/image-respin/verify-parent-release.py --manifest "$TRUST_MANIFEST" --print-board-assets --board "$BOARD")
            companion_args=()
            for asset_name in "${companion_names[@]}"; do companion_args+=(--companion "$PARENT_ASSETS/$asset_name"); done
            production_proof_args=()
            if [[ "$BOARD" == orange-pi-zero-2w ]]; then
              orange_proof="$RESPIN_OUTPUT/orange-image-proof.json"
              production_proof_args+=(--production-proof "orange-image=$GITHUB_WORKSPACE/$orange_proof")
            else
              production_proof_args+=(
                --production-proof "raspberry-sanitized=$GITHUB_WORKSPACE/$RESPIN_OUTPUT/raspberry-sanitized-image-proof.txt"
              )
            fi
            python3 tools/image-respin/workflow_records.py setup-post-proof \
              --root "$GITHUB_WORKSPACE" \
              --requested-build "$RESPIN_OUTPUT/requested-build.json" \
              --manifest "$TRUST_MANIFEST" \
              --board "$BOARD" \
              --runtime-bundle "$RUNTIME_BUNDLE" \
              --artifact "$RESPIN_ARTIFACT" \
              --respin-provenance "$RESPIN_ARTIFACT.provenance.json" \
              --setup-proof "$GITHUB_WORKSPACE/$SETUP_PROOF" \
              "${production_proof_args[@]}" \
              "${companion_args[@]}" \
              --workflow .github/workflows/respin-board-image.yml \
              --output "$RESPIN_OUTPUT/setup-post-proof.json"
            python3 tools/image-respin/workflow_records.py verify-post-setup \
              --root "$GITHUB_WORKSPACE" \
              --record "$RESPIN_OUTPUT/setup-post-proof.json"
            exit 0
          fi
          mapfile -t companion_names < <(python3 tools/image-respin/verify-parent-release.py --manifest "$TRUST_MANIFEST" --print-board-assets --board "$BOARD")
          companion_args=()
          for asset_name in "${companion_names[@]}"; do companion_args+=(--companion "$PARENT_ASSETS/$asset_name"); done
          proof_output_args=()
          proof_template_args=()
          if [[ "$BOARD" == orange-pi-zero-2w ]]; then
            orange_proof="$RESPIN_OUTPUT/orange-image-proof.json"
            proof_output_args+=(--proof-output "orange-image=$orange_proof")
            proof_template_args+=(--proof-template "orange-image=orange-production")
          else
            sanitation_proof="$RESPIN_OUTPUT/raspberry-sanitized-image-proof.txt"
            proof_output_args+=(--proof-output "raspberry-sanitized=$sanitation_proof")
            proof_template_args+=(--proof-template "raspberry-sanitized=raspberry-sanitized")
          fi
          python3 tools/image-respin/workflow_records.py post-proof \
            --root "$GITHUB_WORKSPACE" \
            --requested-build "$RESPIN_OUTPUT/requested-build.json" \
            --manifest "$TRUST_MANIFEST" \
            --board "$BOARD" \
            --runtime-bundle "$RUNTIME_BUNDLE" \
            --artifact "$RESPIN_ARTIFACT" \
            --respin-provenance "$RESPIN_ARTIFACT.provenance.json" \
            "${proof_output_args[@]}" \
            "${proof_template_args[@]}" \
            "${companion_args[@]}" \
            --workflow .github/workflows/respin-board-image.yml \
            --output "$RESPIN_OUTPUT/post-proof.json"
          python3 tools/image-respin/workflow_records.py verify-post \
            --root "$GITHUB_WORKSPACE" \
            --record "$RESPIN_OUTPUT/post-proof.json"

      - name: Generate and validate board-qualified respin checksums
        run: |
          set -euo pipefail
          output_dir="$GITHUB_WORKSPACE/$RESPIN_OUTPUT"
          artifact_name="$(basename "$RESPIN_ARTIFACT")"
          sums_name="SHA256SUMS-$BOARD.txt"
          if [[ "$SETUP_LAYER" == setup-portal ]]; then
            record_name=setup-post-proof.json
            case "$BOARD" in
              orange-pi-zero-2w) proof_names=(setup-layer-proof.json orange-image-proof.json) ;;
              raspberry-pi-zero-2w) proof_names=(setup-layer-proof.json raspberry-sanitized-image-proof.txt) ;;
              *) exit 1 ;;
            esac
          else
            record_name=post-proof.json
            case "$BOARD" in
              orange-pi-zero-2w) proof_names=(orange-image-proof.json) ;;
              raspberry-pi-zero-2w) proof_names=(raspberry-sanitized-image-proof.txt) ;;
              *) exit 1 ;;
            esac
          fi
          (cd "$output_dir" && sha256sum requested-build.json "$record_name" "$artifact_name" "$artifact_name.provenance.json" "${proof_names[@]}" > "$sums_name" && sha256sum -c "$sums_name")
          mapfile -t non_files < <(find "$output_dir" -mindepth 1 -maxdepth 1 ! -type f -printf '%f\n')
          [[ "${#non_files[@]}" == 0 ]] || { echo "Respin output contains a non-file entry" >&2; exit 1; }
          mapfile -t actual < <(find "$output_dir" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(requested-build.json "$record_name" "$artifact_name" "$artifact_name.provenance.json" "${proof_names[@]}" "$sums_name")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${actual[*]}" == "${expected_sorted[*]}" ]] || { echo "Respin output entries are not exact" >&2; exit 1; }

      - name: Upload derived respin artifact only
        if: inputs.setup_layer == 'runtime-only'
        uses: actions/upload-artifact@v7
        with:
          name: octessera-${{ inputs.board }}-derived-runtime-respin
          path: ./respin-output/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload derived setup artifact only
        if: inputs.setup_layer == 'setup-portal'
        uses: actions/upload-artifact@v7
        with:
          name: octessera-${{ inputs.board }}-derived-setup-respin
          path: ./respin-output/*
          if-no-files-found: error
          retention-days: 7
