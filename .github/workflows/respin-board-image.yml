name: Respin board image

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  respin:
    name: Respin Orange runtime image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BOARD: orange-pi-zero-2w
      SOURCE_SHA: ${{ github.sha }}
      PARENT_RECORD: resources/image-parents/orange-pi-zero-2w-current.json
      PARENT_ASSETS: parent-assets
      RUNTIME_BUNDLE: runtime-bundle
      RESPIN_OUTPUT: respin-output
    steps:
      - name: Checkout immutable workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable source and application version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          case "$BOARD" in
            orange-pi-zero-2w) ;;
            *) echo "Unsupported board: $BOARD" >&2; exit 1 ;;
          esac
          version="$(python3 tools/release/check_version_consistency.py)"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          echo "OCTESSERA_VERSION=$version" >> "$GITHUB_ENV"

      - name: Acquire the reviewed current parent image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(jq -r '.artifact.id' "$PARENT_RECORD")"
          image_name="$(jq -r '.image.name' "$PARENT_RECORD")"
          gh api "repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/parent.zip"
          mkdir -p "$PARENT_ASSETS"
          unzip -j "$RUNNER_TEMP/parent.zip" "$image_name" -d "$PARENT_ASSETS"
          echo "PARENT_IMAGE=$PARENT_ASSETS/$image_name" >> "$GITHUB_ENV"

      - name: Install image respin dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends e2fsprogs unzip util-linux xz-utils

      - name: Setup Rust cross target
        uses: dtolnay/rust-toolchain@stable
        with:
          target: aarch64-unknown-linux-gnu

      - name: Install pinned cross
        env:
          CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          trap 'rm -f "$archive"' EXIT
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-gnu.tar.gz
          printf '%s  %s\n' "$CROSS_SHA256" "$archive" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin
          cross --version

      - name: Build selected runtime exactly once
        run: |
          set -euo pipefail
          docker pull rust:1-bookworm
          cross build --release --locked --target aarch64-unknown-linux-gnu -p octessera-pi --features hardware-orange-pi-zero-2w
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Create exact production runtime bundle
        run: |
          set -euo pipefail
          python3 tools/image-respin/runtime_bundle.py \
            --binary target/aarch64-unknown-linux-gnu/release/octessera-pi \
            --board "$BOARD" \
            --version "$OCTESSERA_VERSION" \
            --output "$RUNTIME_BUNDLE"

      - name: Respin the reviewed parent image
        run: |
          set -euo pipefail
          mkdir -p "$RESPIN_OUTPUT"
          output="$RESPIN_OUTPUT/octessera-$OCTESSERA_VERSION-$BOARD-derived-runtime-respin.img.xz"
          sudo python3 tools/image-respin/respin.py \
            --parent-record "$PARENT_RECORD" \
            --parent-image "$PARENT_IMAGE" \
            --runtime-bundle "$RUNTIME_BUNDLE" \
            --version "$OCTESSERA_VERSION" \
            --output "$output"
          sudo chown "$(id -u):$(id -g)" "$output"
          (cd "$RESPIN_OUTPUT" && sha256sum "$(basename "$output")" > "SHA256SUMS-$BOARD.txt" && sha256sum -c "SHA256SUMS-$BOARD.txt")

      - name: Upload derived respin artifact only
        uses: actions/upload-artifact@v7
        with:
          name: octessera-orange-pi-zero-2w-derived-runtime-respin
          path: ./respin-output/*
          if-no-files-found: error
          retention-days: 7
