name: Build Armbian image
description: Build an Armbian image with Octessera userpatches
inputs:
  board:
    required: true
    description: Armbian board slug
  release:
    required: true
    description: Armbian release
  kernel_branch:
    required: true
    description: Armbian kernel branch
  ui:
    required: true
    description: minimal, server, or desktop environment name
  compression:
    required: true
    description: Armbian COMPRESS_OUTPUTIMAGE value
  extensions:
    required: false
    default: octessera_midi octessera_audio octessera_sd2 octessera_image_sanitize
    description: Space-separated Armbian extensions; Octessera MIDI, AHUB audio, SPI1 SD2, and image sanitization are always added when absent
  armbian_build_ref:
    required: true
    description: Reviewed immutable armbian/build commit SHA
  share_log:
    required: true
    description: Armbian SHARE_LOG value
  image_kind:
    required: false
    default: diagnostic
    description: Image mode; diagnostic or production
  runtime_bundle_path:
    required: false
    default: ""
    description: Local production runtime bundle directory
  source_sha:
    required: false
    default: ""
    description: Full Octessera source commit SHA for provenance
  boot_proof_mode:
    required: true
    description: Exact Orange boot proof mode
  construction_contract:
    required: true
    description: Exact Orange Phase 5 construction contract path
  rolling_pin_bootstrap:
    required: false
    default: false
    description: Temporary non-release rolling-pin discovery lane; only the exact candidate framework SHA is accepted
runs:
  using: composite
  steps:
    - name: Install final image proof dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends cpio zstd
    - name: Validate build target before checkout
      shell: bash
      env:
        OCTESSERA_ARMBIAN_BOARD: ${{ inputs.board }}
        OCTESSERA_ARMBIAN_RELEASE: ${{ inputs.release }}
        OCTESSERA_ARMBIAN_KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        OCTESSERA_ARMBIAN_UI: ${{ inputs.ui }}
        OCTESSERA_ARMBIAN_COMPRESSION: ${{ inputs.compression }}
        OCTESSERA_ARMBIAN_EXTENSIONS: ${{ inputs.extensions }}
        OCTESSERA_ARMBIAN_SHARE_LOG: ${{ inputs.share_log }}
        OCTESSERA_IMAGE_KIND: ${{ inputs.image_kind }}
        OCTESSERA_RUNTIME_BUNDLE_PATH: ${{ inputs.runtime_bundle_path }}
        OCTESSERA_BOOT_PROOF_MODE: ${{ inputs.boot_proof_mode }}
        OCTESSERA_CONSTRUCTION_CONTRACT: ${{ inputs.construction_contract }}
        OCTESSERA_ROLLING_PIN_BOOTSTRAP: ${{ inputs.rolling_pin_bootstrap }}
        ARMBIAN_BUILD_REF: ${{ inputs.armbian_build_ref }}
      run: |
        set -euo pipefail
        [[ "$OCTESSERA_ARMBIAN_BOARD" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Invalid board slug.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_BOARD" == orangepizero2w ]] || { echo 'This Octessera image path accepts only orangepizero2w.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_RELEASE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Invalid release.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_KERNEL_BRANCH" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Invalid kernel branch.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_KERNEL_BRANCH" == current ]] || { echo 'This Octessera image path accepts only the current kernel family.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_UI" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid UI value.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_COMPRESSION" =~ ^[a-z0-9,._-]+$ ]] || { echo 'Invalid compression value.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_EXTENSIONS" =~ ^[A-Za-z0-9,._[:space:]-]*$ ]] || { echo 'Invalid extensions value.' >&2; exit 1; }
        effective_extensions="$(bash "$GITHUB_ACTION_PATH/../../../tools/armbian-image/resolve-armbian-extensions.sh" "$OCTESSERA_ARMBIAN_EXTENSIONS")"
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_midi([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_midi.' >&2; exit 1; }
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_audio([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_audio.' >&2; exit 1; }
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_sd2([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_sd2.' >&2; exit 1; }
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_image_sanitize([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_image_sanitize.' >&2; exit 1; }
        if [[ "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == true ]]; then
          [[ "$effective_extensions" == 'octessera_midi octessera_audio octessera_sd2 octessera_image_sanitize' ]] || { echo 'Rolling-pin bootstrap requires the exact effective extension set.' >&2; exit 1; }
        fi
        [[ "$OCTESSERA_ARMBIAN_SHARE_LOG" =~ ^(yes|no)$ ]] || { echo 'Invalid share_log value.' >&2; exit 1; }
        [[ "$OCTESSERA_IMAGE_KIND" == diagnostic || "$OCTESSERA_IMAGE_KIND" == production ]] || { echo 'image_kind must be diagnostic or production.' >&2; exit 1; }
        if [[ "$OCTESSERA_IMAGE_KIND" == diagnostic && -n "$OCTESSERA_RUNTIME_BUNDLE_PATH" ]]; then
          echo 'Diagnostic images must not receive a runtime bundle.' >&2
          exit 1
        fi
        if [[ "$OCTESSERA_IMAGE_KIND" == production ]]; then
          [[ -n "$OCTESSERA_RUNTIME_BUNDLE_PATH" && -d "$OCTESSERA_RUNTIME_BUNDLE_PATH" && ! -L "$OCTESSERA_RUNTIME_BUNDLE_PATH" ]] || { echo 'Production images require a local runtime bundle directory.' >&2; exit 1; }
          runtime_entries="$(find -P "$OCTESSERA_RUNTIME_BUNDLE_PATH" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          [[ "$runtime_entries" == $'SHA256SUMS\noctessera-pi\noctessera-runtime.json' ]] || { echo 'Production runtime bundle must contain exactly octessera-pi, octessera-runtime.json, and SHA256SUMS.' >&2; exit 1; }
          while IFS= read -r runtime_entry; do
            [[ -f "$OCTESSERA_RUNTIME_BUNDLE_PATH/$runtime_entry" && ! -L "$OCTESSERA_RUNTIME_BUNDLE_PATH/$runtime_entry" ]] || { echo "Production runtime bundle entry is not a regular file: $runtime_entry" >&2; exit 1; }
          done <<< "$runtime_entries"
        fi
        [[ "$OCTESSERA_BOOT_PROOF_MODE" == phase5-constructor ]] || { echo 'Orange image proof mode must be phase5-constructor.' >&2; exit 1; }
        [[ "$OCTESSERA_CONSTRUCTION_CONTRACT" == resources/image-construction/boot-layers/orange-pi-zero-2w.json ]] || { echo 'Orange construction contract path is not exact.' >&2; exit 1; }
        [[ "$ARMBIAN_BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Qualification image builds require a reviewed immutable Armbian commit SHA.' >&2; exit 1; }
        [[ "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == true || "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == false ]] || { echo 'rolling_pin_bootstrap must be true or false.' >&2; exit 1; }
        if [[ "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == true ]]; then
          [[ "${GITHUB_EVENT_NAME:-}" == workflow_dispatch ]] || { echo 'Rolling-pin bootstrap is allowed only from workflow_dispatch.' >&2; exit 1; }
          [[ "$OCTESSERA_ARMBIAN_BOARD" == orangepizero2w && "$OCTESSERA_ARMBIAN_RELEASE" == trixie && "$OCTESSERA_ARMBIAN_KERNEL_BRANCH" == current ]] || { echo 'Rolling-pin bootstrap requires the exact Orange trixie/current build tuple.' >&2; exit 1; }
          [[ "$OCTESSERA_ARMBIAN_UI" == minimal && "$OCTESSERA_ARMBIAN_COMPRESSION" == sha,img,xz && "$OCTESSERA_ARMBIAN_SHARE_LOG" == yes ]] || { echo 'Rolling-pin bootstrap requires the exact diagnostic/minimal build settings.' >&2; exit 1; }
          [[ "$OCTESSERA_IMAGE_KIND" == diagnostic && -z "$OCTESSERA_RUNTIME_BUNDLE_PATH" ]] || { echo 'Rolling-pin bootstrap requires a diagnostic image without a runtime bundle.' >&2; exit 1; }
          [[ "$ARMBIAN_BUILD_REF" == 3da49cffcb8ac58a919d86816fec4659c410ff1e ]] || { echo 'Rolling-pin bootstrap requires the exact candidate Armbian source pin.' >&2; exit 1; }
        else
          [[ "$ARMBIAN_BUILD_REF" == 3da49cffcb8ac58a919d86816fec4659c410ff1e ]] || { echo 'Qualification image builds require the reviewed Armbian source pin.' >&2; exit 1; }
        fi
    - name: Free runner disk space
      shell: bash
      run: |
        set -euo pipefail
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        docker system prune -af || true
        df -h
    - name: Checkout Armbian build framework
      uses: actions/checkout@v4
      with:
        repository: armbian/build
        ref: ${{ inputs.armbian_build_ref }}
        path: build
        fetch-depth: 1
    - name: Install Octessera userpatches
      shell: bash
      env:
        OCTESSERA_IMAGE_KIND: ${{ inputs.image_kind }}
        OCTESSERA_BOOT_PROOF_MODE: ${{ inputs.boot_proof_mode }}
        OCTESSERA_CONSTRUCTION_CONTRACT: ${{ inputs.construction_contract }}
        OCTESSERA_RUNTIME_BUNDLE_PATH: ${{ inputs.runtime_bundle_path }}
      run: |
        set -euo pipefail
        mkdir -p build/userpatches
        rsync -a custom/userpatches/ build/userpatches/
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        bash "$custom_root/tools/armbian-image/stage-canonical-welcome.sh" "$GITHUB_WORKSPACE/build/userpatches/overlay"
        python3 "$custom_root/tools/armbian-image/stage-device-config.py" "$GITHUB_WORKSPACE/build/userpatches/overlay"
        bash "$custom_root/tools/armbian-image/stage-musical-assets.sh" "$GITHUB_WORKSPACE/build/userpatches/overlay/usr/share/octessera"
        bash "$custom_root/tools/wifi-connect/build-patched-ci.sh"
        sudo python3 "$custom_root/tools/legal/stage_notices.py" \
          --repository-root "$custom_root" \
          --destination-root "$GITHUB_WORKSPACE/build/userpatches/overlay"
        wifi_connect_artifact_root="$custom_root/target/wifi-connect-patched"
        wifi_connect_legal_root="$custom_root/third_party/wifi-connect-4.11.84"
        wifi_connect_stage="$GITHUB_WORKSPACE/build/userpatches/overlay/usr/local/share/octessera/wifi-connect"
        wifi_connect_expected_sha256=929a5b937a771a0e4f96446242af217c61118aedaaaa053aff75af61151c6acc
        wifi_connect_patch_sha256=3481ef27637c5c4a176b59f74af4e2c232f6c67de8399eaf705fe6431ffc8939
        for wifi_connect_file in wifi-connect wifi-connect.metadata.json cargo-metadata.json; do
          test -f "$wifi_connect_artifact_root/$wifi_connect_file" && test ! -L "$wifi_connect_artifact_root/$wifi_connect_file"
        done
        for wifi_connect_file in LICENSE THIRD-PARTY-NOTICES.md portal-address-readiness.patch; do
          test -f "$wifi_connect_legal_root/$wifi_connect_file" && test ! -L "$wifi_connect_legal_root/$wifi_connect_file"
        done
        echo "$wifi_connect_expected_sha256  $wifi_connect_artifact_root/wifi-connect" | sha256sum -c -
        echo "$wifi_connect_patch_sha256  $wifi_connect_legal_root/portal-address-readiness.patch" | sha256sum -c -
        install -d -m 0755 "$wifi_connect_stage"
        for wifi_connect_file in wifi-connect.metadata.json cargo-metadata.json; do
          install -m 0644 "$wifi_connect_artifact_root/$wifi_connect_file" "$wifi_connect_stage/$wifi_connect_file"
        done
        install -m 0755 "$wifi_connect_artifact_root/wifi-connect" "$wifi_connect_stage/wifi-connect"
        for wifi_connect_file in LICENSE THIRD-PARTY-NOTICES.md; do
          install -m 0644 "$wifi_connect_legal_root/$wifi_connect_file" "$wifi_connect_stage/$wifi_connect_file"
        done
        mkdir -p build/userpatches/overlay/usr/local/lib/octessera build/userpatches/overlay/usr/local/sbin
        install -m 0755 custom/tools/storage/octessera-sd-card build/userpatches/overlay/usr/local/sbin/octessera-sd-card
        install -m 0644 custom/tools/storage/octessera-sd-card-lib.sh build/userpatches/overlay/usr/local/lib/octessera/octessera-sd-card-lib.sh
        install -m 0755 custom/tools/storage/octessera-orange-storage build/userpatches/overlay/usr/local/sbin/octessera-orange-storage
        install -m 0755 custom/tools/storage/octessera-orange-storage-control build/userpatches/overlay/usr/local/sbin/octessera-orange-storage-control
        install -m 0644 custom/tools/device-update/updater_protocol.py build/userpatches/overlay/usr/local/lib/octessera/updater_protocol.py
        install -m 0644 custom/tools/device-update/updater_contract.py build/userpatches/overlay/usr/local/lib/octessera/updater_contract.py
        install -m 0644 custom/tools/device-update/updater_state.py build/userpatches/overlay/usr/local/lib/octessera/updater_state.py
        install -m 0644 custom/tools/device-update/updater_assets.py build/userpatches/overlay/usr/local/lib/octessera/updater_assets.py
        install -m 0644 custom/tools/device-update/updater_guard.py build/userpatches/overlay/usr/local/lib/octessera/updater_guard.py
        install -m 0644 custom/tools/device-update/updater_cli.py build/userpatches/overlay/usr/local/lib/octessera/updater_cli.py
        install -m 0644 custom/tools/device-update/updater_profiles.py build/userpatches/overlay/usr/local/lib/octessera/updater_profiles.py
        if [[ "$OCTESSERA_IMAGE_KIND" == production ]]; then
          runtime_bundle="$(cd "$OCTESSERA_RUNTIME_BUNDLE_PATH" && pwd)"
          production_runtime="build/userpatches/overlay/usr/local/lib/octessera/production-runtime"
          mkdir -p "$production_runtime" build/userpatches/overlay/etc/octessera
          for runtime_entry in octessera-pi octessera-runtime.json SHA256SUMS; do
            install -m 0644 "$runtime_bundle/$runtime_entry" "$production_runtime/$runtime_entry"
          done
          cat > build/userpatches/overlay/etc/octessera/image-contract.json <<'EOF'
        {
          "schema_version": 1,
          "image_kind": "production",
          "runtime_enabled_default": true
        }
        EOF
        elif [[ -e build/userpatches/overlay/usr/local/lib/octessera/production-runtime || -L build/userpatches/overlay/usr/local/lib/octessera/production-runtime ]]; then
          echo 'Diagnostic images must not stage a runtime bundle.' >&2
          exit 1
        fi
    - name: Install Armbian build requirements
      shell: bash
      run: |
        set -euo pipefail
        cd build
        sudo ./compile.sh requirements
        sudo chown -R "$USER:$USER" .
    - name: Stage reviewed Orange source lock
      if: ${{ inputs.rolling_pin_bootstrap != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        source_lock="$custom_root/userpatches/config/sources/git_sources.json"
        effective_source_lock="$GITHUB_WORKSPACE/build/config/sources/git_sources.json"
        expected_source_lock_sha256=e8550bd50d61630518a2470b8e9793cd71653ae0732bc6c1c87726b222529e30
        [[ -f "$source_lock" && ! -L "$source_lock" ]] || { echo 'Reviewed Orange source lock is missing or symlinked.' >&2; exit 1; }
        printf '%s  %s\n' "$expected_source_lock_sha256" "$source_lock" | sha256sum -c -
        [[ -d "$GITHUB_WORKSPACE/build/config/sources" && ! -L "$GITHUB_WORKSPACE/build/config/sources" ]] || { echo 'Armbian config/sources directory is missing or symlinked.' >&2; exit 1; }
        if [[ -e "$effective_source_lock" || -L "$effective_source_lock" ]]; then
          [[ -f "$effective_source_lock" && ! -L "$effective_source_lock" ]] || { echo 'Refusing to overwrite a symlinked or non-regular effective source lock.' >&2; exit 1; }
        fi
        install -m 0644 "$source_lock" "$effective_source_lock"
        [[ -f "$effective_source_lock" && ! -L "$effective_source_lock" ]] || { echo 'Effective Orange source lock is missing or symlinked after staging.' >&2; exit 1; }
        cmp -- "$source_lock" "$effective_source_lock"
        printf '%s  %s\n' "$expected_source_lock_sha256" "$effective_source_lock" | sha256sum -c -
    - name: Prepare rolling-pin candidate source lock
      if: ${{ inputs.rolling_pin_bootstrap == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        bash "$custom_root/tools/armbian-image/prepare-orange-rolling-pin-bootstrap.sh" \
          "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/rolling-pin-bootstrap-capture"
    - name: Build image
      shell: bash
      env:
        OCTESSERA_ARMBIAN_BOARD: ${{ inputs.board }}
        OCTESSERA_ARMBIAN_RELEASE: ${{ inputs.release }}
        OCTESSERA_ARMBIAN_KERNEL_BRANCH: ${{ inputs.kernel_branch }}
        OCTESSERA_ARMBIAN_UI: ${{ inputs.ui }}
        OCTESSERA_ARMBIAN_COMPRESSION: ${{ inputs.compression }}
        OCTESSERA_ARMBIAN_EXTENSIONS: ${{ inputs.extensions }}
        OCTESSERA_ARMBIAN_SHARE_LOG: ${{ inputs.share_log }}
        OCTESSERA_IMAGE_KIND: ${{ inputs.image_kind }}
        OCTESSERA_RUNTIME_BUNDLE_PATH: ${{ inputs.runtime_bundle_path }}
        OCTESSERA_ROLLING_PIN_BOOTSTRAP: ${{ inputs.rolling_pin_bootstrap }}
        ARMBIAN_BUILD_REF: ${{ inputs.armbian_build_ref }}
      run: |
        set -euo pipefail
        [[ "$OCTESSERA_ARMBIAN_BOARD" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Invalid board slug.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_BOARD" == orangepizero2w ]] || { echo 'This Octessera image path accepts only orangepizero2w.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_RELEASE" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Invalid release.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_KERNEL_BRANCH" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo 'Invalid kernel branch.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_KERNEL_BRANCH" == current ]] || { echo 'This Octessera image path accepts only the current kernel family.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_UI" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Invalid UI value.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_COMPRESSION" =~ ^[a-z0-9,._-]+$ ]] || { echo 'Invalid compression value.' >&2; exit 1; }
        [[ "$OCTESSERA_ARMBIAN_EXTENSIONS" =~ ^[A-Za-z0-9,._[:space:]-]*$ ]] || { echo 'Invalid extensions value.' >&2; exit 1; }
        effective_extensions="$(bash "$GITHUB_ACTION_PATH/../../../tools/armbian-image/resolve-armbian-extensions.sh" "$OCTESSERA_ARMBIAN_EXTENSIONS")"
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_midi([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_midi.' >&2; exit 1; }
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_audio([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_audio.' >&2; exit 1; }
        [[ "$effective_extensions" =~ (^|[[:space:],])octessera_image_sanitize([[:space:],]|$) ]] || { echo 'Effective extensions must include octessera_image_sanitize.' >&2; exit 1; }
        if [[ "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == true ]]; then
          [[ "$effective_extensions" == 'octessera_midi octessera_audio octessera_sd2 octessera_image_sanitize' ]] || { echo 'Rolling-pin bootstrap requires the exact effective extension set.' >&2; exit 1; }
        fi
        [[ "$OCTESSERA_ARMBIAN_SHARE_LOG" =~ ^(yes|no)$ ]] || { echo 'Invalid share_log value.' >&2; exit 1; }
        [[ "$ARMBIAN_BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Qualification image builds require a reviewed immutable Armbian commit SHA.' >&2; exit 1; }
        [[ "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == true || "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == false ]] || { echo 'rolling_pin_bootstrap must be true or false.' >&2; exit 1; }
        if [[ "$OCTESSERA_ROLLING_PIN_BOOTSTRAP" == true ]]; then
          [[ "$OCTESSERA_ARMBIAN_BOARD" == orangepizero2w && "$OCTESSERA_ARMBIAN_RELEASE" == trixie && "$OCTESSERA_ARMBIAN_KERNEL_BRANCH" == current ]] || { echo 'Rolling-pin bootstrap requires the exact Orange trixie/current build tuple.' >&2; exit 1; }
          [[ "$OCTESSERA_ARMBIAN_UI" == minimal && "$OCTESSERA_ARMBIAN_COMPRESSION" == sha,img,xz && "$OCTESSERA_ARMBIAN_SHARE_LOG" == yes ]] || { echo 'Rolling-pin bootstrap requires the exact diagnostic/minimal build settings.' >&2; exit 1; }
          [[ "$OCTESSERA_IMAGE_KIND" == diagnostic && -z "$OCTESSERA_RUNTIME_BUNDLE_PATH" ]] || { echo 'Rolling-pin bootstrap requires a diagnostic image without a runtime bundle.' >&2; exit 1; }
          [[ "$ARMBIAN_BUILD_REF" == 3da49cffcb8ac58a919d86816fec4659c410ff1e ]] || { echo 'Rolling-pin bootstrap requires the exact candidate Armbian source pin.' >&2; exit 1; }
        else
          [[ "$ARMBIAN_BUILD_REF" == 3da49cffcb8ac58a919d86816fec4659c410ff1e ]] || { echo 'Qualification image builds require the reviewed Armbian source pin.' >&2; exit 1; }
        fi
        cd build
        build_desktop=no
        build_minimal=no
        desktop_environment=
        desktop_tier=
        if [[ "$OCTESSERA_ARMBIAN_UI" == minimal ]]; then
          build_minimal=yes
        elif [[ "$OCTESSERA_ARMBIAN_UI" != server ]]; then
          build_desktop=yes
          desktop_environment="$OCTESSERA_ARMBIAN_UI"
          desktop_tier=mid
        fi
        build_args=(
          build
          "BOARD=$OCTESSERA_ARMBIAN_BOARD"
          "BRANCH=$OCTESSERA_ARMBIAN_KERNEL_BRANCH"
        )
        build_args+=(REVISION=26.11.0-trunk.22)
        build_args+=(
          "RELEASE=$OCTESSERA_ARMBIAN_RELEASE"
          KERNEL_CONFIGURE=no
          "BUILD_DESKTOP=$build_desktop"
          "BUILD_MINIMAL=$build_minimal"
          "DESKTOP_ENVIRONMENT=$desktop_environment"
          "DESKTOP_TIER=$desktop_tier"
          "ENABLE_EXTENSIONS=$effective_extensions"
          "COMPRESS_OUTPUTIMAGE=$OCTESSERA_ARMBIAN_COMPRESSION"
          "SHARE_LOG=$OCTESSERA_ARMBIAN_SHARE_LOG"
          EXPERT=yes
        )
        ./compile.sh "${build_args[@]}"
    - name: Capture rolling-pin bootstrap evidence
      if: ${{ inputs.rolling_pin_bootstrap == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        bash "$custom_root/tools/armbian-image/capture-orange-rolling-pin-bootstrap.sh" \
          "$GITHUB_WORKSPACE/build" \
          "$GITHUB_WORKSPACE/rolling-pin-bootstrap-capture/captured-candidate-source-lock.json" \
          "$GITHUB_WORKSPACE/build/output/bootstrap-evidence"
    - name: Validate built Orange kernel package
      if: ${{ inputs.rolling_pin_bootstrap != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        mapfile -t linux_kernel_packages < <(bash "$custom_root/tools/armbian-image/find-orange-kernel-packages.sh" build/output/debs)
        [[ "${#linux_kernel_packages[@]}" == 2 ]] || { echo "Expected the exact Orange linux-image/linux-dtb package pair." >&2; exit 1; }
        package_evidence="build/output/images/octessera-orange-kernel-evidence.env"
        bash "$custom_root/tools/armbian-image/validate-orange-kernel-package.sh" \
          "${linux_kernel_packages[0]}" "${linux_kernel_packages[1]}" \
          --evidence-output "$package_evidence"
    - name: Stage canonical Orange kernel packages for release handoff
      if: ${{ inputs.rolling_pin_bootstrap != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        mapfile -t linux_kernel_packages < <(bash "$custom_root/tools/armbian-image/find-orange-kernel-packages.sh" build/output/debs)
        [[ "${#linux_kernel_packages[@]}" == 2 ]] || { echo "Expected the exact native Orange linux-image/linux-dtb package pair." >&2; exit 1; }
        mapfile -t canonical_packages < <(python3 - "$custom_root/tools/kernel-patches/orange-midi-interface-manifest.json" <<'PY'
        import json
        import sys

        with open(sys.argv[1], encoding="utf-8") as handle:
            packages = json.load(handle)["build_frameworks"]["armbian"]["packages"]
        if len(packages) != 2:
            raise SystemExit("Orange canonical package list must contain exactly two entries")
        print(packages[0])
        print(packages[1])
        PY
        )
        [[ "${#canonical_packages[@]}" == 2 ]] || { echo "Unable to read Orange canonical package names." >&2; exit 1; }
        mkdir -p build/output/images
        for index in 0 1; do
          destination="build/output/images/${canonical_packages[$index]}"
          [[ ! -e "$destination" ]] || { echo "Refusing to overwrite release handoff package: $destination" >&2; exit 1; }
          install -m 0644 "${linux_kernel_packages[$index]}" "$destination"
        done
    - name: Inspect built image
      if: ${{ inputs.rolling_pin_bootstrap != 'true' }}
      shell: bash
      env:
        OCTESSERA_IMAGE_KIND: ${{ inputs.image_kind }}
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        mapfile -t image_artifacts < <(find build/output/images -maxdepth 1 -type f \( -name '*.img' -o -name '*.img.xz' \) -print | sort)
        [[ "${#image_artifacts[@]}" == 1 ]] || { echo "Expected exactly one image artifact, found ${#image_artifacts[@]}." >&2; exit 1; }
        bash "$custom_root/tools/armbian-image/inspect-output-images.sh" --verification-profile full-constructor --mode "$OCTESSERA_IMAGE_KIND" build/output/images
    - name: Verify generated image checksums
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t image_checksums < <(find build/output/images -maxdepth 1 -type f -name '*.img.xz.sha' -print | sort)
        [[ "${#image_checksums[@]}" == 1 ]] || { echo "Expected exactly one generated .img.xz.sha checksum file, found ${#image_checksums[@]}." >&2; exit 1; }
        for checksum in "${image_checksums[@]}"; do
          echo "Verifying $(basename "$checksum")"
          (
            cd "$(dirname "$checksum")"
            sha256sum -c "$(basename "$checksum")"
          )
        done
    - name: Record qualification provenance
      if: ${{ inputs.rolling_pin_bootstrap != 'true' }}
      shell: bash
      env:
        GITHUB_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        ARMBIAN_BUILD_REF: ${{ inputs.armbian_build_ref }}
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        [[ "$GITHUB_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'GitHub source SHA is not a full commit SHA.' >&2; exit 1; }
        octessera_checkout_head="$(git -C "$custom_root" rev-parse HEAD)"
        [[ "$octessera_checkout_head" == "$GITHUB_SOURCE_SHA" ]] || { echo 'Octessera checkout HEAD does not match GitHub source SHA.' >&2; exit 1; }
        mapfile -t linux_kernel_packages < <(bash "$custom_root/tools/armbian-image/find-orange-kernel-packages.sh" build/output/debs)
        [[ "${#linux_kernel_packages[@]}" == 2 ]] || { echo "Expected the exact Orange linux-image/linux-dtb package pair." >&2; exit 1; }
        bash "$custom_root/tools/armbian-image/write-orange-kernel-provenance.sh" \
          "${linux_kernel_packages[0]}" "${linux_kernel_packages[1]}" \
          build/output/images/octessera-qualification-metadata.txt \
          build/output/images/octessera-orange-kernel-evidence.env build '' build/output/images
    - name: Prove final Orange image against exact packages
      if: ${{ inputs.rolling_pin_bootstrap != 'true' }}
      shell: bash
      env:
        OCTESSERA_IMAGE_KIND: ${{ inputs.image_kind }}
        OCTESSERA_BOOT_PROOF_MODE: ${{ inputs.boot_proof_mode }}
        OCTESSERA_CONSTRUCTION_CONTRACT: ${{ inputs.construction_contract }}
      run: |
        set -euo pipefail
        custom_root="$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)"
        mapfile -t image_artifacts < <(find build/output/images -maxdepth 1 -type f \( -name '*.img' -o -name '*.img.xz' \) -print | sort)
        [[ "${#image_artifacts[@]}" == 1 ]] || { echo "Expected exactly one final Orange image, found ${#image_artifacts[@]}." >&2; exit 1; }
        mapfile -t linux_kernel_packages < <(bash "$custom_root/tools/armbian-image/find-orange-kernel-packages.sh" build/output/debs)
        [[ "${#linux_kernel_packages[@]}" == 2 ]] || { echo "Expected the exact Orange linux-image/linux-dtb package pair." >&2; exit 1; }
        evidence=build/output/images/octessera-orange-kernel-evidence.env
        provenance=build/output/images/octessera-qualification-metadata.txt
        test -f "$evidence" && test -f "$provenance"
        sudo bash "$custom_root/tools/armbian-image/verify-orange-image.sh" \
          --image "${image_artifacts[0]}" \
          --linux-image "${linux_kernel_packages[0]}" \
          --linux-dtb "${linux_kernel_packages[1]}" \
          --evidence "$evidence" \
          --provenance "$provenance" \
          --manifest "$custom_root/tools/kernel-patches/orange-midi-interface-manifest.json" \
          --boot-proof-mode "$OCTESSERA_BOOT_PROOF_MODE" \
          --construction-contract "$custom_root/$OCTESSERA_CONSTRUCTION_CONTRACT" \
          --mode "$OCTESSERA_IMAGE_KIND" \
          --output build/output/images/octessera-orange-image-proof.json
    - name: Clean generated legal staging from disposable output
      if: always()
      shell: bash
      run: |
        sudo rm -rf build/userpatches/overlay/usr/share/doc/octessera
