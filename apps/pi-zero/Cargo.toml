[package]
name = "octessera-pi"
version = "0.8.15"
edition = "2021"
license-file.workspace = true

[[bin]]
name = "octessera-pi"
path = "src/main.rs"

[dependencies]
media-recording = { path = "../../crates/media-recording" }
octessera-hal = { path = "../../crates/hal" }
platform-core = { path = "../../crates/platform-core" }
playback-runtime = { path = "../../crates/playback-runtime" }
store-files = { path = "../../crates/store-files" }
realtime-engine = { path = "../../crates/realtime-engine" }
rodio-engine-source = { path = "../../crates/rodio-engine-source" }
cpal = "0.15"
libc = "0.2"
midir = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simple_logger = "1.16"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
zbus = "5"

[features]
# Instrumented diagnostic builds only: DSP profiles and timing probes.
# Production images and fast deploys build without it.
profiling = ["rodio-engine-source/profiling"]
hardware-raspberry-pi-zero-2w = [
    "octessera-hal/raspberry-pi-zero-2w",
    "realtime-engine/routing-tree-executor",
    "rodio-engine-source/routing-tree-executor",
]
hardware-orange-pi-zero-2w = [
    "octessera-hal/orange-pi-zero-2w",
    "realtime-engine/routing-tree-executor",
    "rodio-engine-source/routing-tree-executor",
]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
playback-runtime = { path = "../../crates/playback-runtime", features = ["test-support"] }
realtime-engine = { path = "../../crates/realtime-engine", features = ["test-support"] }
