[package]
name = "octessera-pi"
version = "0.8.0"
edition = "2021"
license-file.workspace = true

[[bin]]
name = "octessera-pi"
path = "src/main.rs"

[[bin]]
name = "octessera-pi-hdmi-bench"
path = "src/bin/hdmi_bench.rs"

[dependencies]
octessera-hal = { path = "../../crates/hal" }
platform-core = { path = "../../crates/platform-core" }
playback-runtime = { path = "../../crates/playback-runtime" }
realtime-engine = { path = "../../crates/realtime-engine", optional = true }
rodio-engine-source = { path = "../../crates/rodio-engine-source", optional = true }
cpal = { version = "0.15", optional = true }
libc = "0.2"
midir = { version = "0.10", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
simple_logger = "1.16"

[features]
default = ["raspberry-runtime"]
native-audio = [
    "dep:realtime-engine",
    "dep:rodio-engine-source",
    "dep:cpal",
]
raspberry-runtime = [
    "external-midi",
]
external-midi = ["native-audio", "dep:midir"]
hardware-raspberry-pi-zero-2w = ["octessera-hal/raspberry-pi-zero-2w", "raspberry-runtime"]
hardware-rpi-zero-2w = [
    "hardware-raspberry-pi-zero-2w",
    "legacy-hardware-rpi-zero-2w",
]
hardware-pi = ["hardware-raspberry-pi-zero-2w", "legacy-hardware-pi"]
legacy-hardware-rpi-zero-2w = []
legacy-hardware-pi = []
hardware-orange-pi-zero-2w = ["octessera-hal/orange-pi-zero-2w", "external-midi"]

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
playback-runtime = { path = "../../crates/playback-runtime", features = ["test-support"] }
